<style>
:root{
  --bg:#faf7f2; --surface:#fffefb; --surface-2:#fdf6ec; --border:#ece3d6;
  --text:#2a2118; --text-2:#6b5d4a; --muted:#9a8a72;
  --accent:#b45309; --accent-2:#e0901a; --grad:linear-gradient(135deg,#e0901a 0%,#b45309 100%);
  --accent-bg:#fdf3e3; --green:#2f8f5b; --green-bg:#e8f3ec; --red:#c0392f; --red-bg:#fbecea;
  --amber:#b5730a; --amber-bg:#fbf0dd; --r:12px; --r-lg:18px;
  --sh:0 1px 2px rgba(60,40,10,.05),0 2px 8px -4px rgba(60,40,10,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background-color:var(--bg);
  background-image:radial-gradient(circle at 1px 1px,rgba(224,144,26,.07) 1px,transparent 0);
  background-size:24px 24px;color:var(--text);font-size:14px;line-height:1.65}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.brand{display:inline-block;font-size:11px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--accent-bg);color:var(--accent);margin-bottom:8px}
h1{font-size:20px;font-weight:600;margin-bottom:6px}
.sub{color:var(--text-2);font-size:12.5px;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--surface);padding:4px;border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh)}
.tab{flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;transition:.15s}
.tab.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px -4px rgba(224,144,26,.5)}
.pane{display:none}.pane.on{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.q{font-size:15.5px;font-weight:600;margin-bottom:6px}
.q .sm{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:3px}
.hint{color:var(--text-2);font-size:12.5px;margin-bottom:8px}
.sm{font-size:12.5px;color:var(--text-2)}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--text);cursor:pointer;transition:.15s;box-shadow:var(--sh)}
.opt:active{transform:scale(.995)}
.opt.sel{border-color:var(--accent);background:var(--accent-bg)}
.opt b{color:var(--accent)}
.opt.ok{border-color:var(--green);background:var(--green-bg)}
.opt.no{border-color:var(--red);background:var(--red-bg)}
.qtype{display:inline-block;background:var(--accent-bg);color:var(--accent);border-radius:999px;padding:1px 7px;font-size:11px;margin-right:6px}
.tip{background:var(--amber-bg);border-radius:8px;padding:9px 12px;margin-top:6px;font-size:12.5px}
.warn{background:var(--red-bg);border-radius:8px;padding:10px 12px;margin-top:6px;font-size:12.5px;color:var(--red)}
.btn{width:100%;border:none;border-radius:9px;padding:12px;font-size:14.5px;font-weight:600;cursor:pointer;background:var(--grad);color:#fff;box-shadow:0 6px 16px -6px rgba(224,144,26,.4);transition:.15s}
.btn:hover{opacity:.93;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--text-2);border:1px solid var(--border);box-shadow:var(--sh)}
.badge{display:inline-block;background:var(--green-bg);color:var(--green);border-radius:999px;padding:1px 8px;font-size:11px;margin-left:6px}
.redo{font-size:12px;color:var(--accent);cursor:pointer;text-decoration:underline;margin-left:8px}
.ordnum{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;margin-right:6px;padding:0 4px}
.papers{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pchip{flex:1;min-width:96px;text-align:center;padding:9px 10px;border:1px solid var(--border);border-radius:999px;font-size:13px;color:var(--text-2);background:var(--surface);cursor:pointer;box-shadow:var(--sh)}
.pchip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px -4px rgba(224,144,26,.5)}
.kchip{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--text-2);border-radius:999px;padding:5px 11px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap}
.kchip.on{background:var(--grad);color:#fff;border-color:transparent}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--surface);color:var(--text);margin-bottom:12px;outline:none}
input[type=text]:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(224,144,26,.16)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.stat{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stat .pill{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:12.5px;box-shadow:var(--sh)}
.stat .pill b{color:var(--accent)}
.row{padding:12px 0;border-bottom:1px dashed var(--border)}.row:last-child{border:none}
.k{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.v{font-size:15px;font-weight:600}.v.amber{color:var(--accent)}
.bank-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:10px;box-shadow:var(--sh)}
.bank-opt{display:block;padding:8px 11px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:13.5px;color:var(--text)}
.bank-opt.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);font-weight:600}
.reveal-line{background:var(--accent-bg);border-radius:8px;padding:8px 11px;margin-top:6px;font-size:12.5px;color:var(--text-2);line-height:1.7}
.reveal-line b{color:var(--accent)}
</style>
</head>

      <div class="pill">最高分 <b id="s-best">—</b></div>
    </div>
    <div id="qz"></div>
    <div class="card" id="recbox"></div>
  </div>
</div>

var POOL_G=QS.filter(function(q){return q.tag!=='红线'}).concat(NEWBANK,NEWBANK2,NEWBANK3);
var POOL_R=QS.filter(function(q){return q.tag==='红线'}).concat(NEWRED,NEWRED2,NEWRED3);
var PICK_G=16,PICK_R=2,AVOID=4;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* 抽题：优先抽最近 AVOID 次没考过的题，不足时再用旧题补齐 */
function pickN(pool,n){
  var lastAt={},s=Math.min(ST.attempts.length,AVOID);
  for(var i=0;i<s;i++){
    var a=ST.attempts[ST.attempts.length-1-i]; var ids=a.ids; if(!ids)continue;
    for(var j=0;j<ids.length;j++) if(lastAt[ids[j]]===undefined) lastAt[ids[j]]=i;
  }
  var fresh=[],rest=[];
  for(var k=0;k<pool.length;k++){ if(lastAt[pool[k].id]===undefined)fresh.push(pool[k]); else rest.push(pool[k]); }
  rest.sort(function(a,b){return lastAt[b.id]-lastAt[a.id];}); // 越久没考过的排越前
  return shuffle(fresh).concat(rest).slice(0,n);
}

var LVMAP={zengzhi:1,maidan:1,lan13:1,jinsui:1,overseas:1,direct:1,xiaoguimo:1,yibanren:1,wupiao:1,qishui:1,yutui:1,fba:1,huizong:1,ic:1,tuidan:1,weituo:1,wuzhihua:1,liucheng:1,piaozhuan:1,siliu:1,bantuo:1,zhina:1,shoukuan:1,taocan:2,chazhang:2,pingtai:2,ctype:3,genjin:3,gulv:3,tanxu:3,'红线':1};
function lvOf(q){return q.lv||LVMAP[q.tag]||1;}
function lvPool(pool,lv){return pool.filter(function(q){return lvOf(q)===lv;});}
var PAPERS={
  p1:{n:'新人卷',plan:[[1,16]],rl:2},
  p2:{n:'进阶卷',plan:[[1,7],[2,9]],rl:2},
  p3:{n:'主管卷',plan:[[2,6],[3,9]],rl:3}
};
var PAPER='p1';
function setPaper(p){
  PAPER=p;
  var cs=document.querySelectorAll('#papers .pchip');
  var idx={p1:0,p2:1,p3:2}[p]||0;
  for(var i=0;i<cs.length;i++) cs[i].classList.toggle('on',i===idx);
  startQuiz();
}
function startQuiz(){
  var P=PAPERS[PAPER]||PAPERS.p1,list=[],have={};
  for(var i=0;i<P.plan.length;i++){
    var g=pickN(lvPool(POOL_G,P.plan[i][0]),P.plan[i][1]);
    for(var k=0;k<g.length;k++){ if(!have[g[k].id]){list.push(g[k]);have[g[k].id]=1;} }
  }
  var r=pickN(POOL_R,P.rl);
  for(var k2=0;k2<r.length;k2++){ if(!have[r[k2].id]){list.push(r[k2]);have[r[k2].id]=1;} }
  var need=18-list.length;
  if(need>0){
    var ex=pickN(POOL_G.filter(function(q){return !have[q.id];}),need);
    for(var k3=0;k3<ex.length;k3++){list.push(ex[k3]);have[ex[k3].id]=1;}
  }
  QS=shuffle(list).map(function(q){
    if(q.type==='order') return{id:q.id,tag:q.tag,rl:(q.tag==='红线'||!!q.rl),type:'order',q:q.q,o:q.o.slice(),a:q.a.slice(),e:q.e};
    var opts=q.o.map(function(t,i){return{t:t,c:Array.isArray(q.a)?q.a.indexOf(i)>=0:i===q.a};});
    opts=shuffle(opts);
    var ai;
    if(Array.isArray(q.a)){ai=[];for(var i2=0;i2<opts.length;i2++) if(opts[i2].c) ai.push(i2);}
    else{ai=-1;for(var i3=0;i3<opts.length;i3++) if(opts[i3].c) ai=i3;}
    return{id:q.id,tag:q.tag,rl:(q.tag==='红线'||!!q.rl),type:q.type||'single',q:q.q,o:opts.map(function(x){return x.t}),a:ai,e:q.e};
  });
  ANS={};submitted=false;renderQuiz();renderRecords();updHint();
}
function updHint(){
  var P=PAPERS[PAPER]||PAPERS.p1;
  var el=document.getElementById('qzhint'); if(!el)return;
  el.innerHTML='当前「'+P.n+'」· 题库共 <b>'+POOL_G.length+'</b> 道 + 红线 <b>'+POOL_R.length+'</b> 道，每次抽 18 题（含 '+P.rl+' 道红线必答题），选项顺序打乱，并自动避开最近 '+AVOID+' 次已考过的题';
}
function fmt(ts){var d=new Date(ts);var p=function(n){return n<10?'0'+n:''+n};
  return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function renderRecords(){
  var h='<div class="card"><p class="q">交卷记录</p>';
  if(!ST.attempts.length){ h+='<p class="hint">还没有交卷记录，交卷一次就会记录在这里。</p>'; }
  else{
    h+='<p class="hint">共 '+ST.attempts.length+' 次 · 最近在最上方</p>';

         '<div class="v" style="font-size:14px">'+a.score+' 分　答对 '+a.cor+' / '+(a.total||'-')+' 题'+

         '</div></div>';
    }

  }
  h+='</div>';

}
function clearRec(){ if(!confirm('确定清空全部交卷记录？'))return; ST.attempts=[];openRec={};save(ST);updProg();renderRecords(); }
var openRec={};
function toggleRec(i){ openRec[i]=!openRec[i]; renderRecords(); }
function ansTxt(d,ans){
  if(ans===undefined||ans===null||(Array.isArray(ans)&&!ans.length)) return '（未作答）';
  if(Array.isArray(ans)){
    if(d.type==='order'){ var s=[]; for(var k=0;k<ans.length;k++) s.push((k+1)+'.'+d.o[ans[k]]); return s.join(' → '); }
    var m=[]; for(var k2=0;k2<ans.length;k2++) m.push(d.o[ans[k2]]); return m.join('、');
  }
  return d.o[ans];
}
function redoWrong(i){
  var a=ST.attempts[i]; if(!a||!a.detail||!a.wrong||!a.wrong.length){alert('这条记录没有错题');return;}
  var m={}; for(var k=0;k<a.wrong.length;k++) m[a.wrong[k]]=1;
  var list=[];
  for(var k2=0;k2<a.detail.length;k2++){
    var d=a.detail[k2]; if(!m[d.id])continue;
    list.push({id:d.id,tag:d.tag,rl:d.rl,type:d.type,q:d.q,o:d.o.slice(),a:Array.isArray(d.a)?d.a.slice():d.a,e:d.e});
  }
  QS=list; ANS={}; submitted=false;
  renderQuiz();
  var el=document.getElementById('qz');
  if(el&&el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function detHtml(a){
  var h='<div style="margin-top:8px;border-top:1px dashed var(--border)">';
  for(var i=0;i<a.detail.length;i++){
    var d=a.detail[i];
    h+='<div style="padding:9px 0;border-bottom:1px dashed var(--border)">';
    h+='<p style="font-size:13px;margin:0 0 5px;line-height:1.5">'+(i+1)+'. '+d.q+(d.rl?' <span class="qtype">红线</span>':'')+(d.type==='multi'?' <span class="qtype">多选</span>':'')+(d.type==='order'?' <span class="qtype">排序</span>':'')+'</p>';
    h+='<p class="sm" style="margin:2px 0">你选：<span style="color:'+(d.ok?'var(--green)':'var(--red)')+';font-weight:600">'+(d.ok?'✔ ':'✘ ')+ansTxt(d,d.u)+'</span></p>';
    if(!d.ok) h+='<p class="sm" style="margin:2px 0">正确答案：<span style="color:var(--green);font-weight:600">'+ansTxt(d,d.a)+'</span></p>';
    h+='<p class="sm" style="margin:5px 0 0;color:var(--text-2);line-height:1.6">'+d.e+'</p>';
    h+='</div>';
  }
  return h+'</div>';
}
var ANS={},submitted=false;
function isRight(q,ans){
  if(q.type==='multi'){ return q.a.slice().sort().join(',')===(ans||[]).slice().sort().join(','); }
  if(q.type==='order'){ return (ans||[]).join(',')===q.a.join(','); }
  return ans===q.a;
}
function answered(q){
  var a=ANS[q.id];
  if(q.type==='multi') return !!a && a.length>0;
  if(q.type==='order') return !!a && a.length===q.o.length;
  return a!==undefined;
}
function redo(id){ if(submitted)return; ANS[id]=[]; renderQuiz(); }
function renderQuiz(){
  var h='';
  for(var i=0;i<QS.length;i++){
    var q=QS[i],ans=ANS[q.id]||[];
    var tn=q.type==='multi'?'多选':(q.type==='order'?'排序':'单选');
    var tip=q.type==='multi'?'（可多选，全选对才得分）':(q.type==='order'?'（按正确顺序依次点击）':'');
    h+='<div class="card"><p class="hint">第 '+(i+1)+' / '+QS.length+' 题 <span class="qtype">'+tn+'</span></p>';
    h+='<p class="q" style="font-size:14.5px">'+q.q+'</p>';
    if(tip) h+='<p class="sm" style="color:var(--accent);font-size:12px;margin:-2px 0 8px">'+tip+'</p>';
    for(var j=0;j<q.o.length;j++){
      var cls='',pre='';
      if(q.type==='order'){
        var up=ans.indexOf(j),cp=q.a.indexOf(j);
        if(up>=0) pre='<span class="ordnum">'+(up+1)+'</span>';
        if(submitted) cls=(up>=0&&up===cp)?' ok':' no';
        else if(up>=0) cls=' sel';
      }else if(q.type==='multi'){
        var should=q.a.indexOf(j)>=0, got=ans.indexOf(j)>=0;
        if(submitted) cls=should?' ok':(got?' no':'');
        else cls=got?' sel':'';
      }else{
        if(submitted){ if(j===q.a)cls=' ok'; else if(ANS[q.id]===j)cls=' no'; }
        else if(ANS[q.id]===j) cls=' sel';
      }
      h+='<button class="opt'+cls+'" onclick="pick('+q.id+','+j+')">'+pre+q.o[j]+'</button>';
    }
    if(q.type==='order'&&!submitted) h+='<p class="sm" style="margin:8px 0 0"><span class="redo" onclick="redo('+q.id+')">重排</span></p>';
    if(submitted){
      var okk=isRight(q,ANS[q.id]),extra='';
      if(q.type==='order'){ var os=[]; for(var k=0;k<q.a.length;k++) os.push((k+1)+'.'+q.o[q.a[k]]); extra='正确顺序：'+os.join(' → '); }
      else if(q.type==='multi'){ var os2=[]; for(var k2=0;k2<q.a.length;k2++) os2.push(q.o[q.a[k2]]); extra='正确答案：'+os2.join('、'); }
      else extra='正确答案：'+q.o[q.a];
      h+='<div class="tip">'+(okk?'✔ 答对':'✘ 答错。'+extra)+'　'+q.e+'</div>';
    }
    h+='</div>';
  }
  h+='<button class="btn primary" onclick="submitQuiz()">'+(submitted?'再考一次':'交卷')+'</button>';
  if(submitted) h+='<div class="card" style="margin-top:12px" id="qres"></div>';
  document.getElementById('qz').innerHTML=h;
  if(submitted) showRes();
}
function showRes(){
  var a=ST.attempts[ST.attempts.length-1]; if(!a) return;
  var el=document.getElementById('qres'); if(!el) return;
  el.innerHTML='<p class="q">本次得分：<span style="color:'+(a.pass?'var(--green)':'var(--red)')+'">'+a.score+' 分</span>　'+(a.pass?'✔ 合格':'✘ 不合格')+(a.pname?'　<span class="qtype">'+a.pname+'</span>':'')+'</p>'+
    '<p class="hint">'+(a.pass?'可以上场跟客户了。':'未达标：'+(a.score<80?'正确率不足 80%；':'')+(a.score>=80?'红线必答题答错，整卷不合格。':'答错的题已在上方标红，请重点复习。'))+'</p>'+
    (a.weak?'<div class="warn">薄弱知识点：'+a.weak+'</div>':'');
}
function pick(id,j){
  if(submitted)return;
  var q=null; for(var i=0;i<QS.length;i++) if(QS[i].id===id) q=QS[i];
  if(!q)return;
  if(q.type==='multi'||q.type==='order'){
    var arr=ANS[id]||[],k=arr.indexOf(j);
    if(k>=0) arr.splice(k,1); else arr.push(j);
    ANS[id]=arr;
  } else ANS[id]=j;
  renderQuiz();
}
function submitQuiz(){
  if(submitted){ startQuiz(); return; }
  var miss=0; for(var i=0;i<QS.length;i++) if(!answered(QS[i]))miss++;
  if(miss){alert('还有 '+miss+' 题没答完');return;}
  submitted=true;
  var cor=0,wrong=[],rlOk=true;
  for(var i=0;i<QS.length;i++){
    var q=QS[i];
    if(isRight(q,ANS[q.id])){ cor++; }
    else { wrong.push(q.id); if(q.rl) rlOk=false; }
  }
  var sc=Math.round(cor/QS.length*100);
  var pass=sc>=80&&rlOk;
  var ids=[],detail=[];
  for(var m=0;m<QS.length;m++){
    var q=QS[m],u=ANS[q.id],okk=isRight(q,u);
    ids.push(q.id);
    detail.push({id:q.id,q:q.q,tag:q.tag,rl:!!q.rl,type:q.type||'single',
      o:q.o.slice(),a:Array.isArray(q.a)?q.a.slice():q.a,
      u:(Array.isArray(u)?u.slice():u),ok:okk,e:q.e});
  }
  ST.attempts.push({ts:Date.now(),score:sc,total:QS.length,cor:cor,pass:pass,wrong:wrong,weak:weakTags(wrong),ids:ids,detail:detail,paper:PAPER,pname:(PAPERS[PAPER]||PAPERS.p1).n});
  while(ST.attempts.length>20) ST.attempts.shift();
  save(ST);
  renderQuiz();
  renderRecords();
  updProg();
}
var TAGN={zengzhi:'增值税',maidan:'买单出口',lan13:'13栏',jinsui:'金税四期/申报口径',overseas:'9810与9610',xiaoguimo:'小规模',yibanren:'一般人',wupiao:'无票免税',qishui:'企业所得税',yutui:'预退税',fba:'FBA成本',taocan:'套餐档位',direct:'9610',ic:'IC卡/电子口岸',tuidan:'推单',weituo:'电子委托',wuzhihua:'无纸化',huizong:'汇总单',chazhang:'查账/核定',piaozhuan:'普票专票',siliu:'四流合一',bantuo:'半托全托',zhina:'滞纳金罚款',liucheng:'报关流程',ctype:'客户类型',genjin:'跟进节奏',gulv:'异议处理',tanxu:'探需技巧',pingtai:'平台判断',shoukuan:'收款与回款','红线':'红线'};
function weakTags(wrong){
  var m={},out=[];
  for(var i=0;i<wrong.length;i++){
    for(var j=0;j<QS.length;j++) if(QS[j].id===wrong[i]){ m[QS[j].tag]=1; }
  }
  for(var k in m) out.push(TAGN[k]||k);
  return out.join('、')||'无';
}
function updProg(){
  document.getElementById('s-learned').textContent=ST.seen.length+' / '+Object.keys(TERMS).length;
  if(ST.attempts.length){
    var tot=0,cor=0,best=0,c=0;
    for(var i=0;i<ST.attempts.length;i++){
      var a=ST.attempts[i]; best=Math.max(best,a.score);
      tot += (a.total||QS.length); cor += (a.cor!=null ? a.cor : (QS.length-a.wrong.length));
    }
    document.getElementById('s-rate').textContent=Math.round(cor/tot*100)+'%';
    document.getElementById('s-best').textContent=best+' 分';
  }else{
    document.getElementById('s-rate').textContent='—';
    document.getElementById('s-best').textContent='—';
  }
}
(function(){ var el=document.getElementById('qzhint'); if(el) el.innerHTML='题库共 <b>'+POOL_G.length+'</b> 道 + 红线 <b>'+POOL_R.length+'</b> 道，每次随机抽 '+(PICK_G+PICK_R)+' 题（含 '+PICK_R+' 道红线必答题），选项顺序同时打乱，并自动避开最近 '+AVOID+' 次已考过的题'; })();</script><script>
/* ===== 学习模式 ===== */
var ALL = POOL_G.concat(POOL_R);
var CATS = {};
ALL.forEach(function(q){ if(TAGN[q.tag]) CATS[q.tag]=TAGN[q.tag]; });
var studyReveal=false, studyCat='all', studyKw='';
document.getElementById('rcount').textContent = POOL_R.length;
document.getElementById('ccount').textContent = Object.keys(CATS).length;
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function buildChips(){
  var h="<span class=\"kchip"+(studyCat==='all'?' on':'')+"\" onclick=\"setStudyCat('all')\">全部</span>";
  for(var t in CATS){ h+="<span class=\"kchip"+(studyCat===t?' on':'')+"\" onclick=\"setStudyCat('"+t+"')\">"+CATS[t]+"</span>"; }
  document.getElementById('bchips').innerHTML=h;
}
function setStudyCat(t){ studyCat=t; buildChips(); renderBank(); }
function onKw(){ studyKw=document.getElementById('bkw').value.trim(); renderBank(); }
function toggleReveal(){ studyReveal=!studyReveal; document.getElementById('rbtn').textContent= studyReveal?'隐藏答案':'显示答案'; renderBank(); }
function renderBank(){
  var list=ALL.filter(function(q){
    if(studyCat!=='all' && q.tag!==studyCat) return false;
    if(studyKw){
      var k=studyKw.toLowerCase();
      var hit=(q.q||'').toLowerCase().indexOf(k)>=0 || (q.e||'').toLowerCase().indexOf(k)>=0 || (TAGN[q.tag]||'').toLowerCase().indexOf(k)>=0;
      if(!hit) return false;
    }
    return true;
  });
  var h='';
  if(!list.length){ h='<p class="hint">没有匹配的题目。</p>'; }
  for(var i=0;i<list.length;i++){
    var q=list[i];
    var tn=q.type==='multi'?'多选':(q.type==='order'?'排序':'单选');
    h+='<div class="bank-card"><p class="q" style="margin-bottom:8px">'+esc(q.q)+
       (q.rl?' <span class="qtype" style="background:var(--red-bg);color:var(--red)">红线</span>':'')+
       ' <span class="qtype">'+tn+'</span> <span class="qtype" style="opacity:.7">'+(TAGN[q.tag]||q.tag)+'</span></p>';
    for(var j=0;j<q.o.length;j++){
      var correct = Array.isArray(q.a)? (q.a.indexOf(j)>=0) : (j===q.a);
      h+='<div class="bank-opt'+(studyReveal&&correct?' correct':'')+'">'+(studyReveal&&correct?'✔ ':'')+esc(q.o[j])+'</div>';
    }
    if(q.type==='order' && studyReveal){
      var ot=[]; for(var k=0;k<q.a.length;k++) ot.push((k+1)+'. '+esc(q.o[q.a[k]]));
      h+='<div class="reveal-line"><b>正确顺序：</b>'+ot.join(' → ')+'</div>';
    }
    if(studyReveal && q.e){ h+='<div class="reveal-line"><b>解析：</b>'+esc(q.e)+'</div>'; }
    h+='</div>';
  }
  document.getElementById('bank').innerHTML=h;
  document.getElementById('bcount').textContent=list.length;
}

/* ===== 标签页切换 ===== */
function tab(n){
  var ts=document.querySelectorAll('.tab'); for(var i=0;i<ts.length;i++) ts[i].classList.toggle('on', ts[i].dataset.t===n);
  document.getElementById('p-study').classList.toggle('on', n==='study');
  document.getElementById('p-exam').classList.toggle('on', n==='exam');
}

/* ===== 覆盖 updProg：去掉名词库依赖，只统计考核成绩 ===== */
function updProg(){
  var sr=document.getElementById('s-rate'), sb=document.getElementById('s-best');
  if(ST.attempts.length){
    var tot=0,cor=0,best=0;
    for(var i=0;i<ST.attempts.length;i++){
      var a=ST.attempts[i]; best=Math.max(best,a.score);
      var t=a.total||(POOL_G.length+POOL_R.length);
      var c=a.cor!=null?a.cor:(t-(a.wrong?a.wrong.length:0));
      tot+=t; cor+=c;
    }
    if(sr) sr.textContent=Math.round(cor/tot*100)+'%';
    if(sb) sb.textContent=best+' 分';
  }else{
    if(sr) sr.textContent='—';
    if(sb) sb.textContent='—';
  }
}

/* ===== 初始化 ===== */
buildChips();
renderBank();
setPaper('p1');
</script></body></html>

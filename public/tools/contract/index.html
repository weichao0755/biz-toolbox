<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合同生成助手</title>
<script src="./docx.umd.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#faf7f2;color:#2a2118;font-size:14px}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
  .header{background:linear-gradient(120deg,#fffdf9,#fdf3e3,#fbeccb);color:#2a2118;border-radius:12px;padding:22px 26px;margin-bottom:18px;position:relative;padding-right:150px}
  .header h1{font-size:20px;display:flex;align-items:center;gap:8px}
  .header p{font-size:12.5px;color:#6b5d4a;margin-top:6px}
  .rec-btn{position:absolute;top:50%;right:24px;transform:translateY(-50%);background:#fffefb;color:#2a2118;border:1px solid #ece3d6;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
  .rec-btn:hover{background:#fbf5ea;border-color:#e0901a}
  /* AI 配置弹窗统一视觉 */
  .ai-head{display:flex;align-items:center;justify-content:space-between;margin:-20px -22px 16px;padding:16px 22px;background:linear-gradient(120deg,#fffdf9,#fdf3e3,#fbeccb);border-radius:14px 14px 0 0;color:#2a2118;border-bottom:1px solid #ece3d6}
  .ai-head h3{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
  .ai-head h3::before{content:'⚙';font-size:15px;opacity:.9}
  .ai-close{background:#fffefb;border:1px solid #ece3d6;width:28px;height:28px;border-radius:8px;font-size:15px;color:#2a2118;cursor:pointer;line-height:1;transition:.15s}
  .ai-close:hover{background:#fbf5ea;border-color:#e0901a}
  .ai-section{background:#faf7f2;border:1px solid #faf4ea;border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .ai-section-title{font-size:12.5px;font-weight:700;color:#3a2410;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .ai-section-title::before{content:'';width:4px;height:14px;background:linear-gradient(180deg,#f0a93c,#3a2410);border-radius:2px}
  .ai-actions{display:flex;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid #faf4ea;justify-content:flex-end}
  .ai-actions .btn{padding:8px 18px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;border:1px solid transparent;transition:.15s}
  .ai-actions .btn-primary{background:linear-gradient(135deg,#b45309,#e0901a);color:#fff;border:none}
  .ai-actions .btn-primary:hover{filter:brightness(1.1)}
  .ai-actions .btn-ghost{background:#fff;color:#3a3228;border-color:#e8dcd0}
  .ai-actions .btn-ghost:hover{border-color:#f0a93c;color:#3a2410;background:#fbf5ea}
  /* 生成记录弹窗 */
  .rec-bg{position:fixed;inset:0;background:rgba(42,26,10,.45);z-index:90;display:none}
  .rec-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:14px;padding:20px 22px;width:560px;max-width:94vw;height:min(600px,86vh);z-index:91;display:none;flex-direction:column;box-shadow:0 10px 40px rgba(42,33,24,.18)}
  .rec-modal h3{margin:0 0 12px;font-size:15.5px;color:#3a2410}
  .rec-body{flex:1;overflow:auto;min-height:0;padding-right:4px}
  .rec-row{display:flex;align-items:center;gap:10px;border:1px solid #f2e6d8;border-radius:10px;padding:11px 13px;margin-bottom:10px;background:#fffefb}
  .rec-row .rec-t{font-size:13.5px;font-weight:600;color:#2a2118;margin-bottom:3px}
  .rec-row .rec-s{font-size:12px;color:#8a7a62}
  .rec-ops{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
  .rec-badge{display:inline-block;font-size:10.5px;border-radius:9px;padding:1px 7px;margin-left:6px;vertical-align:1px;font-weight:600}
  .rec-empty{background:#faf7f2;border-left:4px solid #9a8a72;border-radius:6px;padding:12px 14px;font-size:12.5px;color:#4a4035;line-height:1.7}
  .rec-tip{font-size:12px;color:#8a7a62;margin-bottom:10px}
  .steps-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .step-chip{flex:1;min-width:96px;background:#fff;border:1px solid #efe6d8;border-radius:8px;padding:8px 10px;font-size:12px;color:#6b5d4a;cursor:pointer;transition:.2s;text-align:center}
  .step-chip .no{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;background:#f2e6d8;color:#6b5d4a;font-size:11px;margin-right:4px}
  .step-chip.active{border-color:#e0901a;color:#2a2118;font-weight:600;background:#fffefb;box-shadow:inset 3px 0 0 #b45309}
  .step-chip.active .no{background:#e0901a;color:#fff}
  .step-chip.done{border-color:#a7d7c5;color:#2f855a}
  .step-chip.done .no{background:#38a169;color:#fff}
  .card{background:#fffefb;border:1px solid #ece3d6;border-radius:12px;padding:24px 26px;box-shadow:0 1px 3px rgba(180,120,40,.06);margin-bottom:16px}
  .card h2{font-size:16px;color:#3a2410;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .card .sub{font-size:12.5px;color:#8a7a62;margin-bottom:18px}
  .type-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .type-card{border:2px solid #f2e6d8;border-radius:10px;padding:18px 16px;cursor:pointer;transition:.2s;background:#faf7f2}
  .type-card:hover{border-color:#cdb389}
  .type-card.sel{border-color:#7a3e07;background:#fbf5ea;box-shadow:0 2px 8px rgba(44,82,130,.12)}
  .type-card.disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.35)}
  .type-card.disabled:hover{border-color:#f2e6d8}
  .tag-dev{display:inline-block;background:#f6efe3;color:#8a7a62;font-size:10.5px;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
  .type-card .ico{font-size:26px}
  .type-card .t{font-size:15px;font-weight:600;color:#3a2410;margin:8px 0 5px}
  .type-card .d{font-size:12px;color:#8a7a62;line-height:1.6}
  .type-card .fields{margin-top:8px;font-size:11.5px;color:#7a3e07}
  .scenario-box{display:flex;gap:12px;margin-top:16px;padding:14px;background:#faf7f2;border:1px dashed #e3d4ba;border-radius:10px}
  .scenario-btn{flex:1;padding:12px 14px;border:1.5px solid #e8dcd0;border-radius:8px;background:#fff;cursor:pointer;text-align:center;transition:.15s}
  .scenario-btn .st{font-size:14px;font-weight:600;color:#3a2410;display:block}
  .scenario-btn .sd{font-size:11.5px;color:#8a7a62;margin-top:4px;display:block;line-height:1.5}
  .scenario-btn.sel{border-color:#7a3e07;background:#fbf5ea;box-shadow:0 1px 5px rgba(44,82,130,.1)}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .fg{margin-bottom:14px}
  .fg label{display:block;font-size:12.5px;color:#4a4035;margin-bottom:5px;font-weight:500}
  .fg label .req{color:#dc2626;margin-left:2px}
  .fg input[type=text],.fg input[type=date],.fg select,.fg textarea{width:100%;border:1px solid #e8dcd0;border-radius:7px;padding:9px 11px;font-size:13.5px;font-family:inherit;background:#fff;transition:.15s;color:#2a2118}
  .fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:#7a3e07;box-shadow:0 0 0 3px rgba(44,82,130,.1)}
  .fg input[readonly]{background:#faf7f2;color:#6b5d4a}
  .fg textarea{resize:vertical;min-height:70px}
  .fg .hint{font-size:11.5px;color:#9a8a72;margin-top:4px}
  .sec-title{font-size:13.5px;font-weight:600;color:#3a2410;border-left:3px solid #7a3e07;padding-left:9px;margin:20px 0 14px}
  .sec-title.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .btn-row{display:flex;justify-content:space-between;margin-top:22px;gap:12px}
  .btn{border:none;border-radius:8px;padding:11px 26px;font-size:14px;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:#b45309;color:#fff}
  .btn-primary:hover:not(:disabled){background:#3a2410}
  .btn-ghost{background:#fff;color:#4a4035;border:1px solid #e8dcd0}
  .btn-ghost:hover{border-color:#cdb389;color:#3a2410}
  .btn-danger{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
  .btn-danger:hover{background:#fecaca}
  .kind-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .kind-btn{padding:6px 18px;border:1.5px solid #e8dcd0;border-radius:7px;background:#fff;color:#4a4035;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
  .kind-btn.sel{border-color:#7a3e07;background:#fbf5ea;color:#3a2410;font-weight:600}
  .default-btn{margin-left:auto;padding:7px 16px;border:none;border-radius:7px;background:linear-gradient(135deg,#7a3e07,#3a2410);color:#fff;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
  .default-btn:hover{opacity:.92}
  .mini-btn{border:1px solid #cdb389;background:#fff;color:#3a2410;border-radius:6px;padding:3px 12px;font-size:12px;cursor:pointer;font-family:inherit}
  .mini-btn:hover{background:#fbf5ea}
  .inst-row{display:grid;grid-template-columns:1.15fr 1fr 42px;gap:10px;align-items:end;margin-bottom:10px}
  .inst-row .del{align-self:center;height:38px;border:1px solid #efe6d8;border-radius:7px;background:#fff;color:#c05252;cursor:pointer;font-size:15px;font-family:inherit}
  .inst-row .del:hover{border-color:#dc2626;color:#dc2626}
  .party-multi{border:1px solid #e8dcd0;border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#f8fafd}
  .party-multi .pm-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
  .party-multi .pm-title{font-weight:600;font-size:13px;color:#3a2410}
  .party-multi .pm-kinds{display:inline-flex;border:1px solid #e8dcd0;border-radius:6px;overflow:hidden}
  .party-multi .pm-kind{border:none;background:#fff;color:#8a7a62;cursor:pointer;font-size:12px;padding:3px 12px;font-family:inherit}
  .party-multi .pm-kind.on{background:#7a3e07;color:#fff}
  .party-multi .del{border:1px solid #efe6d8;border-radius:6px;background:#fff;color:#c05252;cursor:pointer;font-size:12px;padding:2px 10px;font-family:inherit}
  .party-multi .del:hover{border-color:#dc2626;color:#dc2626}
  .radio-row{display:flex;gap:22px;margin-top:6px;flex-wrap:wrap}
  .radio-row label{display:flex;align-items:center;gap:6px;font-size:13px;color:#2a2118;cursor:pointer}
  .radio-row input{accent-color:#7a3e07}
  .clause-item{border:1px solid #efe6d8;border-radius:9px;padding:14px 16px;margin-bottom:12px;background:#faf7f2;position:relative}
  .clause-item .del{position:absolute;right:12px;top:10px;border:none;background:none;color:#c05252;font-size:16px;cursor:pointer}
  .clause-item .del:hover{color:#dc2626}
  .add-clause{width:100%;border:1.5px dashed #d3c4a4;border-radius:9px;padding:11px;background:none;color:#7a3e07;font-size:13px;cursor:pointer;font-family:inherit}
  .add-clause:hover{background:#fbf5ea}
  .ai-settings{border:1px dashed #e3d4ba;background:#faf7f2;border-radius:9px;padding:12px 14px;margin-bottom:16px}
  .ai-cfg-box{margin-top:12px;padding-top:12px;border-top:1px dashed #dbe2ec}
  .ai-desc{margin-bottom:12px}
  .ai-desc textarea{min-height:52px;background:#fbf6ec}
  .ai-bar{display:flex;gap:8px;margin-top:8px}
  .ai-out{margin-top:8px;font-size:12.5px;line-height:1.7}
  .ai-out .ai-loading{color:#8a7a62}
  .ai-out .ai-ok{color:#2f855a}
  .ai-issue{border-left:3px solid #f2e6d8;background:#faf7f2;padding:6px 10px;margin-top:6px;border-radius:0 6px 6px 0;color:#4a4035}
  .ai-issue.warn{border-color:#e6a23c;background:#fdf6ec;color:#8a5a17}
  .ai-issue.ok{border-color:#38a169;background:#f0faf4;color:#2f855a}
  .full-pay-tip{border:1px solid #b7e0cc;background:#f0faf4;color:#2f855a;border-radius:8px;padding:10px 14px;font-size:12.5px;margin:4px 0 6px}
  .review-box{background:#faf7f2;border:1px solid #efe6d8;border-radius:9px;padding:18px 20px}
  .review-box h3{font-size:14px;color:#3a2410;margin:14px 0 8px}
  .review-box h3:first-child{margin-top:0}
  .kv{display:flex;font-size:13px;padding:5px 0;border-bottom:1px dashed #eceff4}
  .kv .k{width:150px;color:#8a7a62;flex-shrink:0}
  .kv .v{color:#2a2118;word-break:break-all}
  .gen-area{text-align:center;padding:10px 0 4px}
  .gen-btn{background:linear-gradient(135deg,#7a3e07,#3a2410);color:#fff;border:none;border-radius:10px;padding:15px 60px;font-size:16px;cursor:pointer;font-family:inherit;letter-spacing:2px;transition:.2s}
  .gen-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(30,58,95,.3)}
  .gen-btn:disabled{opacity:.5;cursor:wait}
  .ok-tip{margin-top:14px;font-size:13px;color:#2f855a;display:none}
  .warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:10px 14px;font-size:12.5px;margin-bottom:14px}
  .empty{color:#9a8a72;font-style:italic}
  @media(max-width:640px){.frow,.frow3,.inst-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>📄 合同生成助手</h1>
    <p>选择合同类型 → 填写甲乙方与标的信息 → 自动生成成品合同（Word）· 支持分期付款与自定义补充协议条款</p>
    <button class="rec-btn" onclick="openContractAiCfgModal()">⚙ AI 配置</button>
  <button class="rec-btn" onclick="openRecords()">📋 生成记录</button>
  </div>
  <div class="steps-bar" id="stepsBar"></div>
  <div id="main"></div>
</div>
<div class="rec-bg" id="recModalBg" onclick="closeRecModal()"></div>
<div class="rec-modal" id="recModal">
  <div class="rec-body" id="recModalBody"></div>
</div>
<div class="rec-bg" id="aiCfgModalBg" onclick="closeAiCfgModal()"></div>
<div class="rec-modal" id="aiCfgModal">
  <div class="rec-body" id="aiCfgModalBody"></div>
</div>

<script>
/* ============================================================
   合同生成助手 · 单文件工具
   流程：1 选择类型 → 2 甲乙方信息 → 3 合同要素 → 4 补充协议 → 5 生成
   当前上线：收购公司合同（面向同行渠道 / 面向客户）
   延后：委托出售合同、债务债权协议（入口保留，标"开发中"）
   ============================================================ */

const LS_KEY = 'contract_tool_data_v2'

/* 金米启航默认信息（甲乙方「输入默认信息」按钮共用） */
const JINMI = {
  name: '深圳市金米启航企业服务有限公司',
  creditCode: '91440300MAERJ8AP0E',
  legalRep: '易俊威'
}
const AGENCY_NAME = JINMI.name

/* 合同类型配置（available:false = 开发中）
   aIsCompany/bIsPerson：锁定甲方/乙方主体类型（委托出售场景甲为中介机构、乙为自然人卖家） */
const TYPES = {
  acquisition: {
    label: '收购公司合同',
    docTitle: '收购公司合同',
    ico: '🏢',
    desc: '甲方（收购方）向乙方（出让方）收购目标公司股权，支持分期支付与补充协议',
    roleA: '收购方', roleB: '出让方',
    targetLabel: '标的公司名称',
    targetPh: '如：深圳市XX科技有限公司',
    hasAmount: true,
    available: true
  },
  intermediary: {
    label: '委托出售合同',
    docTitle: '股权确认出售服务协议',
    ico: '🤝',
    desc: '自然人卖家委托金米启航出售公司100%股权的中介服务协议，含到手价承诺、服务期限、服务费用与违约责任',
    roleA: '中介方', roleB: '委托方（出售方）',
    targetLabel: '标的公司名称',
    targetPh: '如：深圳市XX科技有限公司',
    hasAmount: true,
    available: true,
    aIsCompany: true,      /* 甲方固定为企业法人（中介机构） */
    bIsPerson: true        /* 乙方固定为自然人（公司100%股权持有者） */
  },
  debt: {
    label: '债务债权协议',
    docTitle: '股权转让所涉债权债务责任转让协议',
    ico: '⚖️',
    desc: '股权转让所涉债权债务责任转让协议，旧股东与新股东就营业执照变更日前后的债权债务责任进行分割，每个股东均需签署',
    roleA: '公司旧股东', roleB: '公司新股东',
    targetLabel: '标的公司名称',
    targetPh: '如：深圳市XX科技有限公司',
    hasAmount: false,
    available: true,
    multiParty: true      /* 支持多方股东签署（每个股东可为自然人或企业法人） */
  }
}

const STEPS = [
  {id:'type',  name:'选择类型'},
  {id:'party', name:'甲乙方信息'},
  {id:'terms', name:'合同要素'},
  {id:'extra', name:'补充协议'},
  {id:'gen',   name:'生成合同'}
]

function today(){
  const d=new Date()
  const p=n=>String(n).padStart(2,'0')
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())
}
function autoContractNo(){
  const d=new Date()
  const p=n=>String(n).padStart(2,'0')
  const rnd=Math.floor(Math.random()*900+100)
  return 'HT-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+rnd
}

function emptyParty(){ return { kind:'company', name:'', creditCode:'', legalRep:'', idNo:'', address:'', phone:'' } }
function emptyState(){
  return {
    step: 0,
    type: '',
    scenario: 'peer',                 /* peer=面向同行渠道 client=面向客户 */
    partyA: emptyParty(),             /* 甲方：收购方 */
    partyB: emptyParty(),             /* 乙方：出让方 */
    partiesA: [],                      /* 债务债权：公司旧股东列表（多人签署） */
    partiesB: [],                      /* 债务债权：公司新股东列表（多人签署） */
    terms: {
      target:'',                      /* 标的公司名称 */
      price:'',                       /* 交易价格（收购）/ 甲方承诺到手价格（委托出售）（元） */
      serviceDays:'30',               /* 委托出售：中介服务期限（工作日） */
      aContact:{ name:'郑伟超', phone:'15989082969', email:'461362657@qq.com' },  /* 委托出售：甲方接收通知联系方式 */
      payMode:'inst',                 /* 支付方式：inst=分期 full=全款（签订当日付清） */
      installments:[],                /* 分期：[{node,amount}]，金额单位元 */
      changeHandling:'no',            /* 出让方是否负责所有变更手续：yes/no */
      changeDate:''                   /* 债务债权：营业执照变更生效日期 */
    },
    extra: { clauses: [] },
    meta: { contractNo:autoContractNo(), signDate:today(), signPlace:'深圳市' }
  }
}

let state = loadState()

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY)
    if(raw){
      const s = JSON.parse(raw)
      if(!s || typeof s!=='object') return emptyState()
      const base = emptyState()
      const m = {}
      m.step = 0
      m.type = TYPES[s.type] ? s.type : ''
      m.scenario = s.scenario==='client' ? 'client' : 'peer'
      m.partyA = Object.assign({}, base.partyA, s.partyA||{})
      m.partyB = Object.assign({}, base.partyB, s.partyB||{})
      m.terms = Object.assign({}, base.terms, s.terms||{})
      m.terms.payMode = (s.terms&&s.terms.payMode)==='full' ? 'full' : 'inst'
      m.terms.serviceDays = String((s.terms&&s.terms.serviceDays)||'') || '30'
      m.terms.aContact = Object.assign({}, base.terms.aContact, (s.terms&&s.terms.aContact)||{})
      m.terms.installments = Array.isArray(s.terms&&s.terms.installments)
        ? s.terms.installments.filter(x=>x&&typeof x==='object').map(x=>({node:String(x.node||''),amount:String(x.amount||'')}))
        : []
      m.terms.changeDate = String((s.terms&&s.terms.changeDate)||'')
      m.partiesA = Array.isArray(s.partiesA) ? s.partiesA.filter(x=>x&&typeof x==='object').map(x=>Object.assign({},emptyParty(),x,{kind:x.kind==='company'?'company':'person'})) : []
      m.partiesB = Array.isArray(s.partiesB) ? s.partiesB.filter(x=>x&&typeof x==='object').map(x=>Object.assign({},emptyParty(),x,{kind:x.kind==='company'?'company':'person'})) : []
      m.extra = { clauses: Array.isArray(s.extra&&s.extra.clauses) ? s.extra.clauses.filter(c=>c&&(c.title||c.content)).map(c=>({title:String(c.title||''),content:String(c.content||''),aiDesc:String(c.aiDesc||'')})) : [] }
      m.meta = Object.assign({}, base.meta, s.meta||{})
      if(!m.meta.contractNo) m.meta.contractNo = autoContractNo()
      return m
    }
  }catch(e){ console.error('[loadState]', e) }
  return emptyState()
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)) }
  catch(e){ alert('保存失败：本地存储空间不足，请减少内容后重试') }
}

/* ============ 渲染 ============ */
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }
function val(s){ return esc(s||'') }

function renderNav(){
  const bar = document.getElementById('stepsBar')
  bar.innerHTML = STEPS.map((st,i)=>{
    const cls = i===state.step ? 'active' : (i<state.step ? 'done' : '')
    const no = i<state.step ? '✓' : (i+1)
    const clickable = i<=state.step || (i>0 && i<4 && state.type)
    return `<div class="step-chip ${cls}" ${clickable?`onclick="gotoStep(${i})"`:''} style="${clickable?'':'opacity:.5;cursor:default'}"><span class="no">${no}</span>${st.name}</div>`
  }).join('')
}
function gotoStep(i){ state.step=i; saveState(); renderNav(); renderStep(); window.scrollTo({top:0,behavior:'smooth'}) }

function field(obj,key,label,opt={}){
  const v = val(obj[key])
  const ro = opt.readonly?'readonly':''
  const type = opt.type||'text'
  const hint = opt.hint?`<div class="hint">${opt.hint}</div>`:''
  const req = opt.req?'<span class="req">*</span>':''
  const ph = opt.placeholder?`placeholder="${esc(opt.placeholder)}"`:''
  const group = obj===state.partyA?'partyA':obj===state.partyB?'partyB':obj===state.terms?'terms':obj===state.meta?'meta':'extra'
  return `<div class="fg"><label>${label}${req}</label><input type="${type}" id="f_${key}" value="${v}" ${ph} ${ro} oninput="setVal('${group}','${key}',this.value)">${hint}</div>`
}
function areaField(obj,key,label,opt={}){
  const v = val(obj[key])
  const hint = opt.hint?`<div class="hint">${opt.hint}</div>`:''
  const req = opt.req?'<span class="req">*</span>':''
  return `<div class="fg"><label>${label}${req}</label><textarea id="f_${key}" placeholder="${esc(opt.placeholder||'')}" oninput="setVal('terms','${key}',this.value)">${v}</textarea>${hint}</div>`
}
function setVal(group,key,v){
  state[group][key]=v
  saveState()
}

function renderStep(){
  const main = document.getElementById('main')
  try{
    main.innerHTML = [
      stepType, stepParty, stepTerms, stepExtra, stepGen
    ][state.step]()
  }catch(e){
    main.innerHTML = `<div class="card"><div class="warn">渲染异常：${esc(e.message)}，请刷新页面重试。</div></div>`
    console.error(e)
  }
}

/* ---- 步骤 1：合同类型 ---- */
function stepType(){
  const cards = Object.entries(TYPES).map(([k,t])=>{
    const sel = state.type===k
    const disabled = !t.available
    const click = disabled ? '' : `onclick="pickType('${k}')"`
    return `<div class="type-card ${sel?'sel':''} ${disabled?'disabled':''}" ${click}>
      <div class="ico">${t.ico}</div>
      <div class="t">${t.label}${disabled?'<span class="tag-dev">开发中</span>':''}</div>
      <div class="d">${t.desc}</div>
      <div class="fields">${t.hasAmount?'含金额条款字段':'无需填写金额'}</div>
    </div>`
  }).join('')
  const scenHtml = state.type==='acquisition' ? `
    <div class="scenario-box">
      <div class="scenario-btn ${state.scenario==='peer'?'sel':''}" onclick="setScenario('peer')">
        <span class="st">面向同行渠道</span>
        <span class="sd">我方（金米启航）向同行收购公司，甲方默认为我方，点「输入默认信息」一键填入</span>
      </div>
      <div class="scenario-btn ${state.scenario==='client'?'sel':''}" onclick="setScenario('client')">
        <span class="st">面向客户</span>
        <span class="sd">客户向出让方收购公司，甲方为客户（手动填写，也可用默认信息）</span>
      </div>
    </div>` : ''
  return `
  <div class="card">
    <h2>① 选择合同类型</h2>
    <div class="sub">请选择需要生成的合同类型，选定后开始填写</div>
    <div class="type-grid">${cards}</div>
    ${scenHtml}
    <div class="btn-row"><span></span><button class="btn btn-primary" ${state.type?'':'disabled'} onclick="gotoStep(1)">下一步：填写甲乙方信息 →</button></div>
  </div>`
}
function pickType(k){
  if(!TYPES[k] || !TYPES[k].available) return
  state.type = k
  saveState()
  renderNav(); renderStep()
}
function setScenario(sc){
  if(state.type!=='acquisition') return
  state.scenario = sc==='client' ? 'client' : 'peer'
  saveState(); renderStep()
}

/* ---- 步骤 2：甲乙方 ---- */
function partyBlock(pre, roleLabel, opts={}){
  const o = state[pre]
  const isPerson = o.kind==='person'
  const lockKind = opts.lockKind || ''
  const nameLabel = isPerson ? '姓名' : '公司名称'
  const idLabel = isPerson ? '身份证号' : '统一社会信用代码'
  const dis = (k)=> lockKind && lockKind!==k ? 'disabled style="opacity:.55;cursor:default"' : ''
  const lockHint = lockKind ? `<span class="hint" style="display:inline;margin-left:8px">${lockKind==='company'?'本协议甲方为中介服务机构，固定企业法人':'本协议乙方为公司股权持有者，固定自然人'}</span>` : ''
  return `<div class="sec-title">${pre==='partyA'?'甲方':'乙方'}信息（${roleLabel}）</div>
  <div class="kind-row">
    <button class="kind-btn ${!isPerson?'sel':''}" ${dis('company')} onclick="setKind('${pre}','company')">企业法人</button>
    <button class="kind-btn ${isPerson?'sel':''}" ${dis('person')} onclick="setKind('${pre}','person')">自然人</button>
    ${opts.noDefault?'':`<button class="default-btn" onclick="fillDefault('${pre}')" title="填入深圳市金米启航企业服务有限公司默认信息">输入默认信息</button>`}
    ${lockHint}
  </div>
  <div class="frow">
    ${field(o,'name',nameLabel,{req:1,placeholder:isPerson?'如：张三':'如：深圳市金米启航企业服务有限公司'})}
    ${field(o, isPerson?'idNo':'creditCode', idLabel, {req:1,placeholder:isPerson?'18 位身份证号码':'91 开头的 18 位代码'})}
  </div>
  <div class="frow">
    ${isPerson ? '' : field(o,'legalRep','法定代表人',{req:1,placeholder:'姓名'})}
    ${field(o,'phone','联系电话',{})}
  </div>
  ${field(o,'address', isPerson?'住址':'公司地址', {placeholder:'注册/通讯地址'})}`
}

/* 债务债权 · 多方签署（动态添加/删除股东，每个股东可为自然人或企业法人） */

  return `<div class="party-multi">
    <div class="pm-head">
      <span class="pm-title">${roleLabel} ${idx+1}（${isPerson?'自然人':'企业法人'}）</span>
      <span class="pm-kinds">
        <button class="pm-kind ${isPerson?'on':''}" onclick="setPartyKind('${side}',${idx},'person')">自然人</button>
        <button class="pm-kind ${!isPerson?'on':''}" onclick="setPartyKind('${side}',${idx},'company')">企业法人</button>
      </span>
      ${arr.length>1 ? `<button class="del" onclick="delParty('${side}',${idx})" title="删除此签署人">✕ 删除</button>` : ''}
    </div>
    ${isPerson ? `
    <div class="frow">
      <div class="fg"><label>姓名<span class="req">*</span></label><input type="text" value="${val(o.name)}" placeholder="如：张三" oninput="upParty('${side}',${idx},'name',this.value)"></div>
      <div class="fg"><label>身份证号<span class="req">*</span></label><input type="text" value="${val(o.idNo)}" placeholder="18 位身份证号码" oninput="upParty('${side}',${idx},'idNo',this.value)"></div>
    </div>` : `
    <div class="frow">
      <div class="fg"><label>公司名称<span class="req">*</span></label><input type="text" value="${val(o.name)}" placeholder="如：深圳市XX投资有限公司" oninput="upParty('${side}',${idx},'name',this.value)"></div>
      <div class="fg"><label>统一社会信用代码<span class="req">*</span></label><input type="text" value="${val(o.creditCode)}" placeholder="18 位信用代码" oninput="upParty('${side}',${idx},'creditCode',this.value)"></div>
    </div>
    <div class="frow">
      <div class="fg"><label>法定代表人</label><input type="text" value="${val(o.legalRep)}" placeholder="如：李四" oninput="upParty('${side}',${idx},'legalRep',this.value)"></div>
      <div class="fg"><label>联系电话</label><input type="text" value="${val(o.phone)}" placeholder="手机号码" oninput="upParty('${side}',${idx},'phone',this.value)"></div>
    </div>
    <div class="frow">
      <div class="fg"><label>注册地址</label><input type="text" value="${val(o.address)}" placeholder="注册/通讯地址" oninput="upParty('${side}',${idx},'address',this.value)"></div>
    </div>`}
    ${isPerson ? `
    <div class="frow">
      <div class="fg"><label>联系电话</label><input type="text" value="${val(o.phone)}" placeholder="手机号码" oninput="upParty('${side}',${idx},'phone',this.value)"></div>
      <div class="fg"><label>联系地址</label><input type="text" value="${val(o.address)}" placeholder="通讯地址" oninput="upParty('${side}',${idx},'address',this.value)"></div>
    </div>` : ''}
  </div>`
}
function addParty(side){ state[side].push(Object.assign(emptyParty(),{kind:'person'})); saveState(); renderStep() }
function delParty(side, idx){ if(state[side].length<=1) return; state[side].splice(idx,1); saveState(); renderStep() }
function upParty(side, idx, key, v){ if(state[side][idx]) state[side][idx][key]=v; saveState() }
function setPartyKind(side, idx, kind){
  const o = state[side][idx]; if(!o) return
  o.kind = kind==='company' ? 'company' : 'person'
  if(o.kind==='company'){ o.idNo='' } else { o.creditCode=''; o.legalRep='' }
  saveState(); renderStep()
}
function ensureParties(){
  if(state.type==='debt'){
    if(!state.partiesA.length) state.partiesA.push(Object.assign(emptyParty(),{kind:'person'}))
    if(!state.partiesB.length) state.partiesB.push(Object.assign(emptyParty(),{kind:'person'}))
  }
}

/* 债务债权 · 甲乙方信息（多方股东签署） */
function stepPartyDebt(){
  ensureParties()
  return `

    ${state.partiesA.map((p,i)=>partyBlockMulti('partiesA',i,'旧股东')).join('')}
    <div class="sec-title" style="margin-top:18px">乙方：公司新股东
      <button class="mini-btn" onclick="addParty('partiesB')">＋ 添加新股东</button>
      <span style="font-weight:400;color:#8a7a62;font-size:11.5px">共 ${state.partiesB.length} 位</span>
    </div>
    ${state.partiesB.map((p,i)=>partyBlockMulti('partiesB',i,'新股东')).join('')}
    <div class="sec-title" style="margin-top:18px">签署信息</div>
    <div class="frow3">
      ${field(state.meta,'contractNo','合同编号',{hint:'留空则自动生成'})}

      <button class="btn btn-ghost" onclick="gotoStep(0)">← 上一步</button>
      <button class="btn btn-primary" ${state.partiesA.every(p=>p.name)&&state.partiesB.every(p=>p.name)?'':'disabled'} onclick="gotoStep(2)">下一步：合同要素 →</button>
    </div>

function stepParty(){
  const t = TYPES[state.type]||TYPES.acquisition
  if(state.type==='debt') return stepPartyDebt()
  const lockA = t.aIsCompany ? 'company' : (t.aIsPerson ? 'person' : '')
  const lockB = t.bIsCompany ? 'company' : (t.bIsPerson ? 'person' : '')
  const hint = state.type==='intermediary'
    ? '甲方为中介服务机构（默认金米启航），乙方为公司100%股权持有者（自然人卖家，签字捺印）。'
    : state.scenario==='client'
      ? '面向客户：甲方为收购方（客户），乙方为出让方。'
      : '面向同行：甲方为我方（金米启航），乙方为出让方（同行）。'
  return `
  <div class="card">
    <h2>② 甲乙方信息</h2>
    <div class="sub">${t.label} · ${hint}未锁定的主体可在「企业法人 / 自然人」间切换，输入框标题与合同表述随之变化；点「输入默认信息」自动填入金米启航信息</div>
    ${partyBlock('partyA', t.roleA, {lockKind:lockA})}
    ${partyBlock('partyB', t.roleB, {lockKind:lockB, noDefault:!!lockB})}
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="gotoStep(0)">← 上一步</button>
      <button class="btn btn-primary" ${state.partyA.name&&state.partyB.name?'':'disabled'} onclick="gotoStep(2)">下一步：合同要素 →</button>
    </div>
  </div>`
}
function setKind(pre,k){
  const t = TYPES[state.type]
  const lock = pre==='partyA' ? (t&&t.aIsCompany?'company':(t&&t.aIsPerson?'person':'')) : (t&&t.bIsCompany?'company':(t&&t.bIsPerson?'person':''))
  if(lock && lock!==k) return
  state[pre].kind = k==='person' ? 'person' : 'company'
  saveState(); renderStep()
}
function fillDefault(pre){
  const o = state[pre]
  o.kind = 'company'
  o.name = JINMI.name
  o.creditCode = JINMI.creditCode
  o.legalRep = JINMI.legalRep
  saveState(); renderStep()
}

/* ---- 步骤 3：合同要素 ---- */

    <div class="inst-row">

    <div class="sec-title top">支付方式
      <button class="mini-btn" ${isFull?'':'style="background:#fbf5ea;border-color:#7a3e07;color:#3a2410;font-weight:600"'} onclick="setPayMode('inst')">🔄 分期支付</button>
      <button class="mini-btn" ${isFull?'style="background:#fbf5ea;border-color:#7a3e07;color:#3a2410;font-weight:600"':''} onclick="setPayMode('full')">💰 全款支付</button>
      <span style="font-weight:400;color:#8a7a62;font-size:11.5px">全款：本合同签订当日支付全部款项</span>

    ${isFull

          <button class="mini-btn" onclick="defaultInst()">⚡ 默认两期</button>
          <button class="mini-btn" onclick="addInst()">＋ 添加一期</button>
          <span style="font-weight:400;color:#8a7a62;font-size:11.5px">默认两期：自动生成 2 期结构，金额与节点均可修改</span>

      <label>出让方是否负责所有变更手续？<span class="hint" style="display:inline;margin-left:6px">选「是」后，合同正文将改为由乙方负责办理全部变更手续流程</span></label>
      <div class="radio-row">
        <label><input type="radio" name="changeHandling" value="yes" ${state.terms.changeHandling==='yes'?'checked':''} onchange="setVal('terms','changeHandling','yes')"> 是，乙方负责所有变更手续</label>
        <label><input type="radio" name="changeHandling" value="no" ${state.terms.changeHandling!=='yes'?'checked':''} onchange="setVal('terms','changeHandling','no')"> 否，双方配合办理</label>

    </div>
    <div class="sec-title">签署信息</div>

    <div class="btn-row">
      <button class="btn btn-ghost" onclick="gotoStep(1)">← 上一步</button>

/* 委托出售合同 · 合同要素（到手价 / 服务期限 / 甲方接收通知联系方式） */

  const tm = state.terms

    <div class="frow">

      <div class="fg"><label>&nbsp;</label><div class="hint" style="padding-top:8px">期限届满乙方未明确解除的，服务期限自动续展30个工作日</div></div>
    </div>

const AI_CFG_KEY = 'contract_ai_cfg'
const DEFAULT_AI_KEY = '' // 团队 API Key 请在「AI 配置」面板填写，勿硬编码入库
const AI_PROVIDERS = {
  deepseek:{ name:'DeepSeek',        baseUrl:'https://api.deepseek.com/v1',          model:'deepseek-v4-flash',        text:true },
  silicon: { name:'硅基流动',         baseUrl:'https://api.siliconflow.cn/v1',        model:'Qwen/Qwen2.5-7B-Instruct', text:true },

  custom:  { name:'自定义（OpenAI 兼容）', baseUrl:'',                                model:'',                         text:true }
}
const AI_REQUIRED_CAPS = { text:true }
function loadAiCfg(){
  try{
    const raw = localStorage.getItem(AI_CFG_KEY) || '{}'
    const cfg = Object.assign({ provider:'volcengine', key:DEFAULT_AI_KEY, baseUrl:'', model:'doubao-seed-2-1-pro-260628' }, JSON.parse(raw))
    if(!cfg.key) cfg.key = DEFAULT_AI_KEY
    /* 兼容旧 key 'tencent'，已统一为 hunyuan */
    if(cfg.provider==='tencent' && !AI_PROVIDERS.tencent){ cfg.provider='hunyuan'; if(!cfg.model) cfg.model=AI_PROVIDERS.hunyuan.model }
    return cfg
  }catch(e){ return { provider:'volcengine', key:DEFAULT_AI_KEY, baseUrl:'', model:'doubao-seed-2-1-pro-260628' } }
}
function providerName(k){ return (AI_PROVIDERS[k]&&AI_PROVIDERS[k].name) || k || '未设置' }

/* 本工具独立 AI 接口配置（内联面板） */
function aiCfgOptionsHtml(selected){
  return Object.keys(AI_PROVIDERS).filter(k => {
    const p = AI_PROVIDERS[k]
    for(const cap in AI_REQUIRED_CAPS){ if(AI_REQUIRED_CAPS[cap] && !p[cap]) return false }
    return true
  }).map(k=>{
    const p = AI_PROVIDERS[k]
    return '<option value="'+k+'" '+(selected===k?'selected':'')+'>'+p.name+'</option>'
  }).join('')
}

/* 内置智能引擎：按意图生成条款（按业务具体性排序，避免"支付违约金"误判为付款条款） */
function aiGenLocal(desc){
  const t = String(desc||'').replace(/\s+/g,'')
  const has = (...ks)=>ks.some(k=>t.includes(k))
  let title='补充约定', content=''
  if(has('交割','过户','变更','登记','移交','交接','转让')){
    title='交割与变更登记'
    content='乙方应于本补充条款生效之日起10个工作日内，配合甲方及标的公司完成交割与相关变更登记手续，包括但不限于股东名册变更、工商变更登记、税务登记变更、银行账户信息变更及资质证照、印章的交接。因乙方原因未按期完成的，每逾期一日按交易总价款的万分之五向甲方支付违约金。'
  }else if(has('保密','机密','不得泄露','商业秘密')){
    title='保密义务'
    content='双方对本补充条款内容及在合同履行过程中知悉的对方商业秘密、标的公司经营信息负有保密义务，未经对方书面同意不得向任何第三方披露（依法律法规或有权机关要求披露的除外）。本条款在合同终止或解除后持续有效，保密期限为合同终止后三年。'
  }else if(has('违约','逾期','赔偿','违约金','损失')){
    title='违约责任'
    content='任何一方违反本补充条款约定的，应承担违约责任并赔偿对方因此遭受的直接经济损失。违约方逾期履行义务的，每逾期一日按未履行部分金额的万分之五向守约方支付违约金；逾期超过15个工作日的，守约方有权解除合同并要求违约方赔偿损失。'
  }else if(has('付款','支付','价款','定金','尾款','转账','打款','到账')){
    title='付款安排'
    content='双方确认，本补充条款项下款项均以银行转账方式支付至收款方书面指定的银行账户。付款方应确保款项在约定的付款期限内足额到账；因付款方原因导致款项迟延到账的，按本合同违约责任条款执行。'
  }else if(has('税费','发票','税')){
    title='税费与发票'
    content='因本补充条款项下交易所产生的税费，由双方按照法律法规的规定各自承担。收款方应在收到相应款项后向付款方开具合法有效的发票。'
  }else if(has('争议','诉讼','仲裁','管辖','纠纷')){
    title='争议解决'
    content='因本补充条款引起的或与本补充条款有关的任何争议，双方应友好协商解决；协商不成的，任何一方均有权向合同签订地有管辖权的人民法院提起诉讼。'
  }else if(has('期限','工作日','日内','天内','时间','截止')){
    title='履行期限'
    content='本补充条款项下各项义务的履行期限，均以本合同签订日期为起算日；期限届满日为法定节假日的，顺延至其后第一个工作日。'
  }else if(has('生效','效力')){
    title='生效与效力'
    content='本补充条款自甲乙双方签字（盖章）之日起生效，与主合同具有同等法律效力。本补充条款与主合同约定不一致的，以本补充条款为准。'
  }else if(has('通知','送达','联系方式')){
    title='通知与送达'
    content='双方确认以本合同载明的联系方式为有效送达方式，任何一方联系方式变更的，应提前书面通知对方。通知以专人送达、邮寄或电子邮件方式发出，专人送达的以签收之日视为送达，邮寄的以交邮后第三日视为送达。'
  }else{
    title='补充约定'
    content='经甲乙双方协商一致，就本补充条款事项达成如下约定：双方应本着诚实信用原则全面履行本补充条款项下义务。本补充条款未尽事宜，由双方另行协商解决；协商不成的，按主合同争议解决条款处理。'
  }
  return { title, content }
}

/* 内置合规检查：风险模式库 */
function aiCheckLocal(text){
  const s = String(text||'').trim()
  if(!s) return [{ level:'warn', msg:'条款内容为空，请先填写或生成内容后再检查。' }]
  const issues=[]
  const rules=[
    { re:/不承担(任何)?责任|概不负责|一律不赔|免除.{0,6}责任|无需承担/gi, msg:'「不承担任何责任 / 概不负责」类表述可能构成《民法典》第497条规定的格式条款无效情形，建议改为限定性表述，如"因不可抗力等法定事由导致损失的，依法减免责任"。' },
    { re:/口头|口头约定|口头承诺/gi, msg:'口头约定难以举证，建议全部以书面形式明确并签字确认。' },
    { re:/放弃.{0,8}(诉权|起诉|诉讼|仲裁)|不得(起诉|诉讼|仲裁)|禁止维权/gi, msg:'约定放弃起诉/仲裁等救济权利违反法律规定，相关条款无效，建议删除。' },
    { re:/无需(纳税|缴税|交税|缴纳)|不缴(税|费)|不承担税费|税费.{0,6}乙方?(全部|一律)/gi, msg:'纳税义务由法律法规强制规定，约定"无需缴税/税费一律由某方承担"可能无效并带来税务风险，建议改为"税费由双方依法各自承担，法律法规无明确规定的由双方协商"。' },
    { re:/仲裁/gi, msg:'若约定仲裁解决争议，必须写明具体的仲裁机构全称（如"提交深圳国际仲裁院仲裁"），未写明仲裁机构的仲裁协议可能被认定无效。' },
    { re:/管辖/gi, msg:'争议解决条款须明确约定管辖法院或仲裁机构（如"由合同签订地有管辖权的人民法院管辖"），避免约定不明导致条款无效。' },
    { re:/立即|随时|尽快|及时/gi, msg:'"立即 / 随时 / 尽快"等表述不够明确，容易引发履约争议，建议改为具体期限（如"X 个工作日内"）。' },
    { re:/永久|无条件|无限期|一律/gi, msg:'"永久 / 无条件 / 无限期"等绝对化表述可能显失公平，建议限定适用范围或期限。' },
    { re:/自动(续约|延期|展期)/gi, msg:'"自动续约 / 自动延期"条款建议明确续约条件与通知期，避免未经确认自动延长合同关系。' },
    { re:/代扣|直接抵扣|自行扣除/gi, msg:'涉及款项直接抵扣的约定，建议写明抵扣依据、金额与通知义务，避免争议。' },
    { re:/个人|私人账户|私账/gi, msg:'约定向个人账户付款存在税务与合规风险，建议明确收款账户主体并与合同主体一致。' },
    { re:/第三方(应|须|承担|负责|支付|保证)/gi, msg:'涉及第三方义务的约定，建议确保第三方知情或另行取得其书面同意。' }
  ]
  rules.forEach(r=>{ if(r.re.test(s)) issues.push({ level:'warn', msg:r.msg }) })
  if(!/甲方|乙方|丙方|双方|一方|本公司|我方|对方/.test(s)) issues.push({ level:'warn', msg:'条款中未明确权利义务主体（甲方 / 乙方），建议明确约定由哪一方履行义务、享有权利。' })
  if(/(每(日|天)|每日|逾期.{0,10}).{0,20}(万分之|百分之|千分之)\d*/.test(s)) issues.push({ level:'tip', msg:'违约金约定过高的，对方可依据《民法典》第585条请求人民法院或仲裁机构适当减少；建议约定在合理区间（如日万分之五以内）。' })
  if(/高于|超过|大于/.test(s) && /市场价|评估价|评估值/.test(s)) issues.push({ level:'tip', msg:'涉及价格比较的约定，建议明确参考基准与确定方式，避免"高于市场价"等表述难以认定。' })
  if(!issues.some(x=>x.level==='warn')) issues.push({ level:'ok', msg: issues.length ? '未发现明显合规风险。以上提示为优化建议（非风险阻断），建议仍由专业律师结合具体交易背景最终审定。' : '未发现明显合规风险。建议仍由专业律师结合具体交易背景最终审定。' })
  return issues
}
/* 大模型接口调用（OpenAI 兼容） */
async function aiCallLLM(messages){
  const cfg = loadAiCfg()
  if(!cfg.key || !cfg.model) return null
  const base = cfg.baseUrl || (AI_PROVIDERS[cfg.provider] && AI_PROVIDERS[cfg.provider].baseUrl) || ''
  const url = base.replace(/\/+$/,'') + '/chat/completions'
  const res = await fetch(url, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+cfg.key },
    body: JSON.stringify({ model: cfg.model, messages, temperature:0.3, max_tokens:1200 })
  })
  if(!res.ok) throw new Error('AI 接口错误：HTTP '+res.status)
  const data = await res.json()
  return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || ''
}

/* ============================================================
   合同正文模板（收购公司合同 · 通用标准版，待用户提供实际版本后替换）
   ============================================================ */
function blank(v){ const s=String(v||'').trim(); return s ? s : '＿＿＿＿＿＿＿＿' }

/* 金额转人民币大写（100 → 壹佰元整；1234.56 → 壹仟贰佰叁拾肆元伍角陆分） */
const CN_D = ['零','壹','贰','叁','肆','伍','陆','柒','捌','玖']
function rmbUpper(n){
  n = Math.round((Number(n)||0)*100)/100
  if(!(n>0)) return '零元整'
  const intPart = Math.floor(n)
  const dec = Math.round((n-intPart)*100)
  function four(x){
    if(x===0) return ''
    let s='', added=false
    const q=Math.floor(x/1000), b=Math.floor(x%1000/100), t=Math.floor(x%100/10), o=x%10
    if(q){ s+=CN_D[q]+'仟' }
    if(b){ s+=CN_D[b]+'佰' }
    else if(!added && q && (t||o)){ s+='零'; added=true }
    if(t){ s+=CN_D[t]+'拾' }
    else if(!added && (q||b) && o){ s+='零'; added=true }
    if(o){ s+=CN_D[o] }
    return s
  }
  function intCn(x){
    if(x===0) return ''
    const groups=[]
    while(x>0){ groups.push(x%10000); x=Math.floor(x/10000) }
    let s='', needZero=false
    for(let i=groups.length-1;i>=0;i--){
      const g=groups[i]
      if(g===0){ needZero=true; continue }
      if(s && (needZero || g<1000)) s+='零'
      needZero=false
      s+=four(g)+['','万','亿','万亿'][i]
    }
    return s
  }
  let s = intCn(intPart)
  if(!s) s='零'
  s+='元'
  const jiao=Math.floor(dec/10), fen=dec%10
  if(jiao===0 && fen===0) s+='整'
  else if(jiao===0) s+='零'+CN_D[fen]+'分'
  else if(fen===0) s+=CN_D[jiao]+'角整'
  else s+=CN_D[jiao]+'角'+CN_D[fen]+'分'
  return s
}
/* 表单金额预览文案：有效金额返回大写，否则提示 */
function priceHint(v){
  const t=String(v||'').trim()
  if(!t) return '单位：元 · 输入后自动显示大写'
  const n=Number(t)
  if(t==='' || isNaN(n) || n<0) return '⚠ 请输入有效金额（元）'
  return '大写：'+rmbUpper(n)
}
function cnDate(s){
  if(!s) return '＿＿＿＿年＿＿月＿＿日'
  const [y,m,d]=s.split('-'); return `${y}年${m}月${d}日`
}

/* 生成前校验：确保合同正文不出现未填写的空白位（必填项都在工具中可填） */
function validateBeforeGen(){
  const T = TYPES[state.type]
  const A=state.partyA, B=state.partyB, tm=state.terms
  if(!T) return '请先在第 1 步选择合同类型'
  const roleA = T.roleA||'甲方（收购方）', roleB = T.roleB||'乙方（出让方）'
  /* 债务债权：校验多方股东 */
  if(state.type==='debt'){
    if(!state.partiesA.length) return '请至少添加一位公司旧股东（甲方）'
    if(!state.partiesB.length) return '请至少添加一位公司新股东（乙方）'
    for(let i=0;i<state.partiesA.length;i++){
      const p=state.partiesA[i]
      if(!String(p.name||'').trim()) return `请填写${roleA}（第${i+1}位）${p.kind==='company'?'公司名称':'姓名'}`
      if(p.kind==='company'){ if(!String(p.creditCode||'').trim()) return `请填写${roleA}（第${i+1}位）统一社会信用代码` }
      else if(!String(p.idNo||'').trim()) return `请填写${roleA}（第${i+1}位）身份证号`
    }
    for(let i=0;i<state.partiesB.length;i++){
      const p=state.partiesB[i]
      if(!String(p.name||'').trim()) return `请填写${roleB}（第${i+1}位）${p.kind==='company'?'公司名称':'姓名'}`
      if(p.kind==='company'){ if(!String(p.creditCode||'').trim()) return `请填写${roleB}（第${i+1}位）统一社会信用代码` }
      else if(!String(p.idNo||'').trim()) return `请填写${roleB}（第${i+1}位）身份证号`
    }
    if(!String(tm.target||'').trim()) return '请填写标的公司名称'
    if(!String(tm.changeDate||'').trim()) return '请填写营业执照变更生效日期'
    return ''
  }
  if(!String(A.name||'').trim()) return `请填写${roleA}名称/姓名`
  if(!String(B.name||'').trim()) return `请填写${roleB}名称/姓名`
  if(A.kind==='company' && !String(A.creditCode||'').trim()) return `请填写${roleA}统一社会信用代码`
  if(B.kind==='company' && !String(B.creditCode||'').trim()) return `请填写${roleB}统一社会信用代码`
  if(A.kind==='person' && !String(A.idNo||'').trim()) return `请填写${roleA}身份证号`
  if(B.kind==='person' && !String(B.idNo||'').trim()) return `请填写${roleB}身份证号`
  if(state.type==='intermediary'){
    if(!String(tm.target||'').trim()) return '请填写标的公司名称'
    const priceT=String(tm.price||'').trim(), priceN=Number(priceT)
    if(!priceT || isNaN(priceN) || priceN<0) return '请填写有效的甲方承诺到手价格（元）'
    const days=String(tm.serviceDays||'').trim(), daysN=Number(days)
    if(!days || isNaN(daysN) || daysN<=0) return '请填写有效的中介服务期限（工作日）'
    const ac=tm.aContact||{}
    if(!String(ac.name||'').trim()) return '请填写甲方接收通知的联系人'
    if(!String(ac.phone||'').trim()) return '请填写甲方接收通知的联系电话'
    if(!String(ac.email||'').trim()) return '请填写甲方接收通知的邮箱地址'
  } else if(state.type==='acquisition'){
    if(!String(tm.target||'').trim()) return '请填写标的公司名称'
    const priceT=String(tm.price||'').trim(), priceN=Number(priceT)
    if(!priceT || isNaN(priceN) || priceN<0) return '请填写有效的交易价格（元）'
    if(tm.payMode!=='full'){
      const inst=(tm.installments||[]).filter(x=>String(x.node||'').trim()||String(x.amount||'').trim())
      if(!inst.length) return '请设置分期期数（第 3 步），或选择「全款支付」'
      for(const x of inst){
        if(!String(x.node||'').trim()) return '分期支付节点不能为空，请补全各期信息（第 3 步）'
        const amT=String(x.amount||'').trim(), amN=Number(amT)
        if(!amT || isNaN(amN) || amN<0) return '分期金额必须为有效数字（元），请补全各期金额（第 3 步）'
      }
    }
  }
  return ''
}

async function doGenerate(){
  const err = validateBeforeGen()
  if(err){ alert(err); return }
  const btn = document.getElementById('genBtn')
  btn.disabled = true; btn.textContent = '正在生成…'
  try{
    const d = loadDocx()
    const { Document, Packer, Paragraph, TextRun, AlignmentType, Table, TableRow, TableCell, WidthType, BorderStyle, Footer, PageNumber } = d
    const T = TYPES[state.type]||TYPES.acquisition
    const A = state.partyA, B = state.partyB, tm = state.terms, mt = state.meta

    const FSong = { ascii:'Times New Roman', hAnsi:'Times New Roman', eastAsia:'宋体' }
    const FHei  = { ascii:'Arial', hAnsi:'Arial', eastAsia:'黑体' }
    const R = (text,o={}) => new TextRun({ text:String(text??''), font:o.font||FSong, size:o.size||24, bold:o.bold, color:o.color })
    const bodyP = (text) => new Paragraph({
      children:[R(text)],
      alignment:AlignmentType.JUSTIFIED,
      indent:{ firstLine:480 },
      spacing:{ line:440, lineRule:'auto', after:80 }
    })

    const children = []

    /* 合同编号：右上角 */
    children.push(new Paragraph({
      children:[R('合同编号：'+(mt.contractNo||'＿＿＿＿＿＿'),{size:21,color:'595959'})],
      alignment:AlignmentType.RIGHT,
      spacing:{ after:60 }
    }))

    /* 标题 */
    children.push(new Paragraph({
      children:[R(T.docTitle||T.label,{font:FHei,size:44,bold:true})],
      alignment:AlignmentType.CENTER,
      spacing:{ before:80, after:220, line:360, lineRule:'auto' }
    }))

    /* 甲乙方信息表格（标签右对齐、数值左对齐，自动对齐不漂移） */
    const partyInfoTable = (role,p) => {
      const isPerson = p && p.kind==='person'
      const L = (text) => new TableCell({
        width:{ size:28, type:WidthType.PERCENTAGE },
        margins:{ top:40, bottom:40, left:0, right:100 },
        children:[ new Paragraph({ children:[R(text+'：',{size:22,bold:true})], alignment:AlignmentType.RIGHT, spacing:{ line:320, lineRule:'auto' } }) ]
      })
      const V = (text) => new TableCell({
        width:{ size:72, type:WidthType.PERCENTAGE },
        margins:{ top:40, bottom:40, left:0, right:0 },
        children:[ new Paragraph({ children:[R(text||'＿＿＿＿＿＿＿＿',{size:22})], spacing:{ line:320, lineRule:'auto' } }) ]
      })
      const rows = [ new TableRow({ children:[ L(role), V(((p&&p.name)||'＿＿＿＿＿＿＿＿') + '（' + (isPerson?'自然人':'企业法人') + '）') ] }) ]
      if(isPerson){
        if(p.idNo) rows.push(new TableRow({ children:[ L('身份证号'), V(p.idNo) ] }))
        if(p.address) rows.push(new TableRow({ children:[ L('住址'), V(p.address) ] }))
      } else {
        if(p.creditCode) rows.push(new TableRow({ children:[ L('统一社会信用代码'), V(p.creditCode) ] }))
        if(p.legalRep) rows.push(new TableRow({ children:[ L('法定代表人'), V(p.legalRep) ] }))
        if(p.address) rows.push(new TableRow({ children:[ L('地址'), V(p.address) ] }))
      }
      if(p.phone) rows.push(new TableRow({ children:[ L('联系电话'), V(p.phone) ] }))
      return new Table({
        width:{ size:100, type:WidthType.PERCENTAGE },
        borders:{
          top:{style:BorderStyle.NONE,size:0,color:'FFFFFF'},
          bottom:{style:BorderStyle.NONE,size:0,color:'FFFFFF'},
          left:{style:BorderStyle.NONE,size:0,color:'FFFFFF'},
          right:{style:BorderStyle.NONE,size:0,color:'FFFFFF'},
          insideHorizontal:{style:BorderStyle.NONE,size:0,color:'FFFFFF'},
          insideVertical:{style:BorderStyle.NONE,size:0,color:'FFFFFF'}
        },
        rows
      })
    }
    if(state.type==='debt'){
      /* 债务债权：多方股东，逐个输出信息表格 */
      const pa = state.partiesA.length ? state.partiesA : [A]
      const pb = state.partiesB.length ? state.partiesB : [B]
      pa.forEach((p,i)=>{
        children.push(partyInfoTable((T.roleA||'甲方')+'（第'+(i+1)+'位）', p))
        children.push(new Paragraph({ spacing:{ after:80 } }))
      })
      children.push(new Paragraph({ spacing:{ after:120 } }))
      pb.forEach((p,i)=>{
        children.push(partyInfoTable((T.roleB||'乙方')+'（第'+(i+1)+'位）', p))
        children.push(new Paragraph({ spacing:{ after:80 } }))
      })
      children.push(new Paragraph({ spacing:{ after:180 } }))
    } else {
      children.push(partyInfoTable(T.roleA||'甲方（收购方）', A))
      children.push(new Paragraph({ spacing:{ after:120 } }))
      children.push(partyInfoTable(T.roleB||'乙方（出让方）', B))
      children.push(new Paragraph({ spacing:{ after:180 } }))
    }
    const introText = state.type==='intermediary'
      ? `根据《中华人民共和国民法典》及相关法律法规，乙方就出售其持有的${tm.target||'标的公司'}100%股权事宜委托甲方提供中介服务，经双方协商达成一致，订立本协议，以资共同遵守。`
      : state.type==='debt'
        ? `经协商，${tm.target||'标的公司'}原股东的全部出资均已转让给现任新股东，股东转让出资后，原股东不再享受股东权利，也不再承担股东义务。现就公司在股权转让之前经营过程中已经产生或可能产生的债权债务、经营风险等事项，双方特别约定及声明如下：`
        : `根据《中华人民共和国民法典》及相关法律法规，甲乙双方就${tm.target||'标的公司'}股权收购事宜，经平等协商达成一致，订立本合同，以资共同遵守。`
    children.push(new Paragraph({
      children:[R(introText,{size:24})],
      alignment:AlignmentType.JUSTIFIED, indent:{firstLine:480}, spacing:{ line:360, lineRule:'auto', after:120 }
    }))

    /* 正文条款 */
    const clauses = contractBody()
    const extraClauses = state.extra.clauses.filter(c=>String(c.title||'').trim()||String(c.content||'').trim())
    const allClauses = clauses.concat(extraClauses.length ? extraClauses.map(c=>({t:c.title||'补充约定', body:[String(c.content||'').trim()||'本条具体约定详见双方另行书面确认。']})) : [])
    const CN = ['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十']
    let cnIdx = 0
    allClauses.forEach((c)=>{
      const noNum = c.noNum===true
      let num = ''
      if(!noNum){
        num = c.num!=null ? (CN[c.num-1] || String(c.num)) : (CN[cnIdx] || String(cnIdx+1))
        cnIdx++
      }
      children.push(new Paragraph({
        children:[R((num?`第${num}条　`:'') + c.t,{font:FHei,size:24,bold:true})],
        spacing:{ before:200, after:80, line:340, lineRule:'auto' },
        keepNext:true
      }))
      c.body.forEach(t=>{ if(String(t||'').trim()) children.push(bodyP(t)) })
    })

    /* 签署栏 */
    children.push(new Paragraph({ children:[R(state.type==='acquisition' ? '（以下无正文，为本合同签署页）' : '（以下无正文，为本协议签署页）',{size:21,color:'808080'})], alignment:AlignmentType.CENTER, spacing:{ before:400, after:200 } }))
    const signCell = (role,p,cellWidth,forceWord) => {
      const isPerson = p && p.kind==='person'
      const signWord = forceWord || (isPerson ? (T.bIsPerson && role===T.roleB ? '签字捺印' : '签字') : '盖章')
      const signLines = [
        new Paragraph({ children:[R(`${role}（${signWord}）：${(p&&p.name)||'　　　　　　'}`,{size:24})], spacing:{ line:360, lineRule:'auto', after:200 } })
      ]
      if(isPerson){
        if(p.idNo) signLines.push(new Paragraph({ children:[R('身份证号：'+p.idNo,{size:24})], spacing:{ line:360, lineRule:'auto', after:200 } }))
      } else {
        if(p.creditCode) signLines.push(new Paragraph({ children:[R('统一社会信用代码：'+p.creditCode,{size:24})], spacing:{ line:360, lineRule:'auto', after:200 } }))
        signLines.push(new Paragraph({ children:[R('法定代表人或授权代表（签字）：',{size:24})], spacing:{ line:360, lineRule:'auto', after:200 } }))
      }
      if(p && p.address) signLines.push(new Paragraph({ children:[R('联系地址：'+p.address,{size:24})], spacing:{ line:360, lineRule:'auto', after:200 } }))
      signLines.push(new Paragraph({ children:[R('签署日期：　　年　　月　　日',{size:24})], spacing:{ line:360, lineRule:'auto' } }))
      return new TableCell({
        width:{ size:cellWidth||50, type:WidthType.PERCENTAGE },
        borders:{ top:{style:BorderStyle.NONE}, bottom:{style:BorderStyle.NONE}, left:{style:BorderStyle.NONE}, right:{style:BorderStyle.NONE} },
        margins:{ top:120, bottom:120, left:160, right:160 },
        children: signLines
      })
    }
    const noBorder = { top:{style:BorderStyle.NONE}, bottom:{style:BorderStyle.NONE}, left:{style:BorderStyle.NONE}, right:{style:BorderStyle.NONE}, insideHorizontal:{style:BorderStyle.NONE}, insideVertical:{style:BorderStyle.NONE} }
    if(state.type==='debt'){
      /* 债务债权：每个股东单独签署块（单列全宽），自然人签字捺印 / 企业法人盖章 */
      const pa = state.partiesA.length ? state.partiesA : [A]
      const pb = state.partiesB.length ? state.partiesB : [B]
      pa.forEach((p,i)=>{
        children.push(new Table({ width:{ size:100, type:WidthType.PERCENTAGE }, borders:noBorder, rows:[ new TableRow({ children:[ signCell((T.roleA||'甲方')+'（第'+(i+1)+'位）', p, 100, (p.kind==='company'?'盖章':'签字捺印')) ] }) ] }))
        children.push(new Paragraph({ spacing:{ after:300 } }))
      })
      pb.forEach((p,i)=>{
        children.push(new Table({ width:{ size:100, type:WidthType.PERCENTAGE }, borders:noBorder, rows:[ new TableRow({ children:[ signCell((T.roleB||'乙方')+'（第'+(i+1)+'位）', p, 100, (p.kind==='company'?'盖章':'签字捺印')) ] }) ] }))
        children.push(new Paragraph({ spacing:{ after:300 } }))
      })
    } else {
      children.push(new Table({
        width:{ size:100, type:WidthType.PERCENTAGE },
        borders:noBorder,
        rows:[ new TableRow({ children:[ signCell(T.roleA||'甲方（收购方）',A), signCell(T.roleB||'乙方（出让方）',B) ] }) ]
      }))
    }

    const doc = new Document({
      styles:{ default:{ document:{ run:{ font:FSong, size:24 } } } },
      sections:[{
        properties:{},
        footers:{ default:new Footer({ children:[ new Paragraph({ alignment:AlignmentType.CENTER,
          children:[ R('第 ',{size:18,color:'808080'}), new TextRun({children:[PageNumber.CURRENT],size:18,color:'808080',font:FSong}), R(' 页',{size:18,color:'808080'}) ] }) ] }) },
        children
      }]
    })

    const blob = await Packer.toBlob(doc)
    const a = document.createElement('a')
    a.href = URL.createObjectURL(blob)
    a.download = `${T.docTitle||T.label}-${(tm.target||'未命名').slice(0,20)}-${(mt.contractNo||'')}.docx`
    document.body.appendChild(a); a.click(); a.remove()
    setTimeout(()=>URL.revokeObjectURL(a.href),5000)
    document.getElementById('okTip').style.display='block'
    saveRecord()
  }catch(e){
    console.error(e)
    alert('生成失败：'+(e&&e.message||e))
  }finally{
    btn.disabled=false; btn.textContent='生成合同（Word）'
  }
}

/* ============ 生成记录（历史合同快照：载入数据 / 查看摘要 / 重新导出） ============ */
const REC_KEY = 'contract_records_v1'
const REC_LIMIT = 30
function fmtTime(ts){
  const d=new Date(ts), p=x=>String(x).padStart(2,"0")
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())
}
function loadRecords(){
  try{ const arr=JSON.parse(localStorage.getItem(REC_KEY)||"[]"); return Array.isArray(arr)?arr:[]; }catch(e){ return []; }
}
function findRecord(id){ return loadRecords().find(r=>r.id===id) || null; }
function recSummary(){
  const t = TYPES[state.type]||TYPES.acquisition
  let parties
  if(state.type==='debt'){
    parties = '旧股东'+(state.partiesA.length||0)+'人 · 新股东'+(state.partiesB.length||0)+'人'
  }else{
    parties = (state.partyA.name||'甲方') + ' ↔ ' + (state.partyB.name||'乙方')
  }
  return { t, parties }
}
function saveRecord(){
  try{
    const { t, parties } = recSummary()
    const rec = {
      id: "r"+Date.now(),
      time: Date.now(),
      timeStr: fmtTime(Date.now()),
      type: state.type,
      typeName: t.label,
      target: state.terms.target || "未命名标的",
      parties,
      contractNo: state.meta.contractNo || "",
      signDate: state.meta.signDate || "",
      snapshot: JSON.stringify(state)
    }
    let list = loadRecords().filter(x=>!(x.type===rec.type && x.target===rec.target && x.contractNo===rec.contractNo))
    list.unshift(rec)
    if(list.length > REC_LIMIT) list = list.slice(0, REC_LIMIT)
    localStorage.setItem(REC_KEY, JSON.stringify(list))
  }catch(e){ console.warn("saveRecord 失败", e) }
}
function openRecModal(h){
  document.getElementById('recModalBody').innerHTML=h
  document.getElementById('recModal').style.display='flex'
  document.getElementById('recModalBg').style.display='block'
  document.body.style.overflow='hidden'
}
function closeRecModal(){
  document.getElementById('recModal').style.display='none'
  document.getElementById('recModalBg').style.display='none'
  document.body.style.overflow=''
}
function openRecords(){
  const list = loadRecords()
  let h = '<h3>📋 近期生成记录</h3>'
  if(!list.length){
    h += '<div class="rec-empty">暂无记录。<br>每次「生成合同（Word）」成功后会自动保存一条记录：可随时<b>📂 载入数据</b>修改后重新生成，避免重复填写。</div>'
  }else{
    h += '<div class="rec-tip">共 '+list.length+' 条 · 同类型同标的同编号保留最新一条 · 最多保留 '+REC_LIMIT+' 条</div>'
    h += list.map(rec=>{
      const typeBadge = '<span class="rec-badge" style="background:#fbeccb;color:#b45309">'+esc(rec.typeName)+'</span>'
      return `<div class="rec-row">
        <div style="min-width:0">
          <div class="rec-t">${esc(rec.target)}${typeBadge}</div>
          <div class="rec-s">🕐 ${rec.timeStr} · ${esc(rec.parties)}${rec.contractNo?' · 编号 '+esc(rec.contractNo):''}</div>
        </div>
        <div class="rec-ops">
          <button class="btn btn-primary" onclick="loadRecord('${rec.id}')">📂 载入数据</button>
          <button class="btn btn-ghost" onclick="viewRecord('${rec.id}')">📄 查看</button>
          <button class="btn btn-danger" style="padding:5px 9px" onclick="delRecord('${rec.id}')">删</button>
        </div>
      </div>`
    }).join('')
  }
  h += '<div style="margin-top:12px;text-align:right"><button class="btn btn-ghost" onclick="closeRecModal()">关闭</button></div>'
  openRecModal(h)
}
function loadRecord(id){
  const rec = findRecord(id); if(!rec) return
  if(!confirm("将载入「"+rec.timeStr+"」记录的完整数据（覆盖当前表单），确定？")) return
  try{
    state = JSON.parse(rec.snapshot)
    state.step = 4
    saveState(); renderNav(); renderStep()
    closeRecModal()
    window.scrollTo({top:0,behavior:'smooth'})
  }catch(e){ alert("载入失败："+e.message) }
}
function viewRecord(id){
  const rec = findRecord(id); if(!rec) return
  let h = '<h3>📄 历史合同记录</h3>'
  h += '<div style="background:#fdf4e6;border-left:4px solid #e0901a;border-radius:6px;padding:10px 13px;font-size:12.5px;margin-bottom:12px;line-height:1.8">'
  h += '<b>'+esc(rec.typeName)+'</b> · '+esc(rec.target)+' · 生成于 '+rec.timeStr+'</div>'
  h += '<div class="kv"><span class="k">合同类型</span><span class="v">'+esc(rec.typeName)+'</span></div>'
  h += '<div class="kv"><span class="k">标的公司</span><span class="v">'+esc(rec.target)+'</span></div>'
  h += '<div class="kv"><span class="k">签约主体</span><span class="v">'+esc(rec.parties)+'</span></div>'
  h += '<div class="kv"><span class="k">合同编号</span><span class="v">'+esc(rec.contractNo||'—')+'</span></div>'
  h += '<div class="kv"><span class="k">签订日期</span><span class="v">'+esc(rec.signDate||'—')+'</span></div>'
  h += '<div style="margin-top:10px;font-size:12.5px;color:#8a7a62">💡 点击「载入数据」可恢复该合同的全部填写内容，到生成步骤即可重新导出 Word。</div>'
  h += '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">'
  h += '<button class="btn btn-primary" onclick="loadRecord(\''+rec.id+'\')">📂 载入数据并重新生成</button>'
  h += '<button class="btn btn-ghost" onclick="openRecords()">← 返回列表</button>'
  h += '<button class="btn btn-ghost" onclick="closeRecModal()">关闭</button></div>'
  openRecModal(h)
}
function delRecord(id){
  if(!confirm("确定删除这条记录？")) return
  localStorage.setItem(REC_KEY, JSON.stringify(loadRecords().filter(r=>r.id!==id)))
  openRecords()
}

/* ============ 初始化 ============ */
renderNav()
renderStep()
saveState()
</script>

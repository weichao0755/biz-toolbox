<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>建筑工程资质办理查询助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#faf7f2;color:#2a2118;min-height:100vh}
header{background:linear-gradient(120deg,#fffdf9,#fdf3e3,#fbeccb);color:#2a2118;padding:16px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:19px}
header .sub{font-size:12px;color:#6b5d4a}
.gear-btn{border:1px solid #ece3d6;border-radius:8px;padding:6px 12px;font-size:13px;background:#fffefb;color:#2a2118;cursor:pointer;font-family:inherit;white-space:nowrap;margin-left:auto}
.gear-btn:hover{background:rgba(255,255,255,.25)}
.wrap{max-width:1000px;margin:22px auto;padding:0 16px;display:flex;gap:18px;align-items:flex-start}
.side{width:230px;background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(180,120,40,.06);position:sticky;top:16px;flex-shrink:0}
.side .step-item{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;border-radius:8px;color:#3a3228;cursor:pointer;margin-bottom:2px}
.side .step-item .num{width:20px;height:20px;border-radius:50%;background:#f2e6d8;color:#6b5d4a;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:bold}
.side .step-item.active{background:#e0901a;color:#fff;font-weight:bold}
.side .step-item.active .num{background:#fff;color:#e0901a}
.side .step-item.done .num{background:#16A34A;color:#fff}
.main{flex:1;background:#fff;border-radius:12px;padding:26px 28px;box-shadow:0 1px 3px rgba(180,120,40,.06);min-height:520px}
.main h2{font-size:17px;color:#7a3e07;margin-bottom:4px}
.main .hint{font-size:12px;color:#9a8a72;margin-bottom:16px;line-height:1.7}
.sel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.sel-item{border:1.5px solid #f2e6d8;border-radius:10px;padding:12px 8px;text-align:center;font-size:13px;cursor:pointer;background:#fff;transition:all .15s}
.sel-item:hover{border-color:#e0901a;background:#fdf4e6}
.sel-item.active{border-color:#e0901a;background:#e0901a;color:#fff;font-weight:bold}
.tools{display:flex;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap}
.btn{border:none;border-radius:8px;padding:9px 20px;font-size:13.5px;cursor:pointer;font-family:inherit}
.btn-primary{background:#b45309;color:#fff}.btn-primary:hover{background:#b45309}
.btn-green{background:#16A34A;color:#fff}.btn-green:hover{background:#15803D}
.btn-ghost{background:#fffefb;color:#2a2118;border:1px solid #ece3d6}.btn-ghost:hover{background:#fbf5ea;border-color:#e0901a}
.btn-orange{background:#D97706;color:#fff}.btn-orange:hover{background:#B45309}
.result-area{margin-top:8px}
.info-card{background:#fff;border:1px solid #f2e6d8;border-radius:10px;padding:16px;margin-bottom:14px}
.info-card h3{font-size:15px;color:#7a3e07;margin-bottom:10px;border-left:4px solid #e0901a;padding-left:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.info-card h3 .tag{font-size:11px;background:#fbeccb;color:#92400e;padding:2px 8px;border-radius:10px;font-weight:normal}
.info-card table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
.info-card th{background:#fdf4e6;color:#7a3e07;padding:7px 9px;text-align:left;font-weight:600}
.info-card td{padding:7px 9px;border-bottom:1px solid #faf7f2;vertical-align:top}
.duration-box{font-size:15px;font-weight:700;color:#92400e;background:#fdf4e6;border:1px solid #f6e0b8;border-radius:8px;padding:10px 14px;line-height:1.7}
.duration-note{font-size:11.5px;color:#6b5d4a;margin-top:6px;line-height:1.7}
.proc-step{display:flex;gap:10px;margin:8px 0}
.proc-step .pn{width:24px;height:24px;border-radius:50%;background:#e0901a;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:bold}
.proc-step .pc{flex:1;font-size:13px;line-height:1.7}
.proc-step .pc b{color:#7a3e07}
.block-item{background:#FEF3F2;border:1px solid #FECACA;border-left:4px solid #DC2626;border-radius:8px;padding:10px 13px;margin:8px 0;font-size:13px;line-height:1.7}
.block-item b{color:#991B1B}
.alt-card{background:#F0FDF4;border:1px solid #BBF7D0;border-left:4px solid #16A34A;border-radius:10px;padding:14px;margin:14px 0}
.alt-card h3{color:#15803D;border-left:none;padding-left:0}
.alt-card p{font-size:13px;line-height:1.8;margin-top:4px}
.verify-box{background:#faf7f2;border:1px solid #f2e6d8;border-radius:10px;padding:14px;margin:14px 0}
.verify-box .vhead{display:flex;align-items:center;gap:8px;font-size:13px;color:#4B5560;margin-bottom:8px;flex-wrap:wrap}
.verify-box .vhead .dot{width:8px;height:8px;border-radius:50%;background:#16A34A}
.verify-box .vhead .dot.working{background:#F59E0B;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.verify-box .vbody{font-size:13px;line-height:1.8;color:#2a2118;white-space:pre-wrap}
.verify-box .vbody .src{font-size:11.5px;color:#6b5d4a;margin-top:8px;white-space:normal}
.verify-box .vbody .src a{color:#e0901a;text-decoration:none}
.disclaimer{font-size:11.5px;color:#9a8a72;background:#F9FAFB;border-radius:6px;padding:8px 10px;margin-top:10px;line-height:1.6}
.ai-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;gap:12px}
.ai-loading .spinner{width:36px;height:36px;border:3px solid #f2e6d8;border-top-color:#e0901a;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-status{font-size:12.5px;color:#6b5d4a;text-align:center;line-height:1.7}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;font-weight:600;vertical-align:middle}
.badge-green{background:#DCFCE7;color:#15803D}
.badge-yellow{background:#FEF3C7;color:#B45309}
.badge-gray{background:#faf7f2;color:#6b5d4a}
.badge-red{background:#FEE2E2;color:#B91C1C}
.draft-json{width:100%;height:300px;border:1px solid #e8dcd0;border-radius:8px;padding:10px;font-family:Consolas,Monaco,monospace;font-size:12px;line-height:1.6;resize:vertical;background:#faf7f2}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;color:#3a3228;margin:12px 0}
.check-row input{width:15px;height:15px;accent-color:#e0901a}
.first-card{background:#fdf4e6;border:1px solid #f6e0b8;border-left:4px solid #e0901a;border-radius:10px;padding:14px;margin:14px 0}
.first-card h3{color:#92400e;font-size:15px;margin-bottom:8px;border:none;padding-left:0}
.first-card p{font-size:13px;line-height:1.8;color:#3a3228}
.warn-card{background:#FFFBEB;border:1px solid #FDE68A;border-left:4px solid #D97706;border-radius:10px;padding:14px;margin:14px 0}
.warn-card h3{color:#92400E;font-size:15px;margin-bottom:8px;border:none;padding-left:0}
.warn-card p{font-size:13px;line-height:1.8;color:#78350F}
.fb-block{background:#FFFDF5;border:1px solid #FDE68A;border-radius:10px;padding:14px;margin:12px 0}
.fb-block .fb-note{font-size:12.5px;color:#B45309;background:#FEF3C7;border-radius:6px;padding:7px 10px;margin-bottom:10px;line-height:1.7}
.tag-yellow{font-size:11px;background:#FEF3C7;color:#B45309;padding:2px 8px;border-radius:10px;font-weight:normal}
.modal-bg{position:fixed;inset:0;background:rgba(42,26,10,.45);display:none;z-index:50}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:14px;padding:24px;width:560px;max-width:94vw;height:min(620px,88vh);box-sizing:border-box;z-index:51;display:none;flex-direction:column;box-shadow:0 10px 40px rgba(42,33,24,.15)}
.modal h3{margin-bottom:12px;font-size:15px;flex-shrink:0}
#modalBody{flex:1;overflow:auto;min-height:0}
.fitem{margin-bottom:14px}
.fitem label{display:block;font-size:12.5px;color:#4a4035;margin-bottom:4px}
.fitem input,.fitem select{width:100%;padding:8px 10px;border:1px solid #e8dcd0;border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff}
.fitem .src-note{font-size:11px;color:#9a8a72;margin-top:3px;line-height:1.5}
.fitem .divider{border-top:1px solid #f2e6d8;margin:14px 0}
/* AI 配置弹窗统一视觉 */
.ai-head{display:flex;align-items:center;justify-content:space-between;margin:-20px -22px 16px;padding:16px 22px;background:linear-gradient(120deg,#fffdf9,#fdf3e3,#fbeccb);border-radius:14px 14px 0 0;color:#2a2118;border-bottom:1px solid #ece3d6}
.ai-head h3{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.ai-head h3::before{content:'⚙';font-size:15px;opacity:.9}
.ai-warn{background:#fff4f4;border:1px solid #f9c5c6;border-left:4px solid #e5484d;color:#b42318;font-size:12px;padding:12px 14px;border-radius:10px;line-height:1.6;margin-bottom:16px}
.ai-warn b{color:#b42318}
.ai-section{background:#faf7f2;border:1px solid #faf4ea;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.ai-section-title{font-size:12.5px;font-weight:700;color:#2a1a0a;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ai-section-title::before{content:'';width:4px;height:14px;background:linear-gradient(180deg,#e0901a,#b45309);border-radius:2px}
.ai-actions{display:flex;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid #faf4ea;justify-content:flex-end}
.ai-actions .btn{padding:8px 18px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;border:1px solid transparent;transition:.15s}
.ai-actions .btn-primary{background:linear-gradient(135deg,#b45309,#e0901a);color:#fff;border:none}
.ai-actions .btn-primary:hover{filter:brightness(1.1)}
.ai-actions .btn-ghost{background:#fff;color:#3a3228;border-color:#e8dcd0}
.ai-actions .btn-ghost:hover{border-color:#e0901a;color:#2a1a0a;background:#fbf5ea}
footer{text-align:center;color:#9a8a72;font-size:12px;padding:20px}
@media(max-width:760px){.wrap{flex-direction:column}.side{width:100%;position:static;display:flex;flex-wrap:wrap}.side .step-item{width:auto}}
</style>
</head>
<body>
<header>
  <h1>建筑工程资质办理查询助手</h1>
  <span class="sub">选省市·选资质·看条件流程卡点·安许配套·区市国三级优先·联网验证最新政策</span>
  <button class="gear-btn" onclick="openConfig()">⚙ AI 配置</button>
</header>
<div class="wrap">
  <div class="side" id="sideNav"></div>
  <div class="main" id="mainArea"></div>
</div>
<div class="modal-bg" id="modalBg" onclick="closeModal()"></div>
<div class="modal" id="modal"><h3 id="modalTitle"></h3><div id="modalBody"></div></div>
<footer>信息仅供参考，以当地住建主管部门最新公告为准 · 数据标注政策依据与更新时间 · 本地录入数据可导出提交共享库</footer>
<script>
// ========== 配置 ==========
let aiConfig={platform:"volcengine",apiKey:"",model:"doubao-seed-2-1-pro-260628"};
const DEFAULT_SEARCH_KEY=""; // 博查搜索 Key 请在「⚙ 配置」面板填写，勿硬编码入库
const DEFAULT_AI_KEY=""; // 团队 API Key 请在「AI 配置」面板填写，勿硬编码入库
let searchConfig={provider:"bocha",key:""};
const AI_PLATFORMS={
  deepseek:{name:"DeepSeek",url:"https://api.deepseek.com/chat/completions",models:[{id:"deepseek-v4-flash",name:"deepseek-v4-flash（快速·推荐）"},{id:"deepseek-chat",name:"deepseek-chat（V3）"}],text:true},
  zhipu:{name:"智谱GLM",url:"https://open.bigmodel.cn/api/paas/v4/chat/completions",models:[{id:"glm-4-flash",name:"glm-4-flash（免费）"},{id:"glm-4-plus",name:"glm-4-plus"}],text:true},
  qwen:{name:"通义千问",url:"https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions",models:[{id:"qwen-turbo",name:"qwen-turbo"},{id:"qwen-plus",name:"qwen-plus"}],text:true},
  hunyuan:{name:"腾讯混元",url:"https://api.hunyuan.cloud.tencent.com/v1/chat/completions",models:[{id:"hunyuan-turbo-s",name:"hunyuan-turbo-s（均衡·推荐）"},{id:"hunyuan-lite",name:"hunyuan-lite（免费）"}],text:true},
  baidu:{name:"百度千帆",url:"https://qianfan.baidubce.com/v2/chat/completions",models:[{id:"ernie-speed-128k",name:"ernie-speed-128k（免费）"}],text:true},
  ifly:{name:"讯飞星火",url:"https://spark-api-open.xf-yun.com/v1/chat/completions",models:[{id:"spark-lite",name:"spark-lite（免费）"}],text:true},
  volcengine:{name:"火山引擎方舟",url:"https://ark.cn-beijing.volces.com/api/v3/chat/completions",models:[{id:"doubao-seed-2-1-pro-260628",name:"doubao-seed-2-1-pro（最强）"},{id:"doubao-seed-2-1-turbo-260628",name:"doubao-seed-2-1-turbo（快速）"},{id:"doubao-1-5-pro-32k-250115",name:"doubao-1-5-pro-32k（轻量）"}],text:true},
    custom:{name:"自定义",url:"",models:[],text:true}
};
const AI_REQUIRED_CAPS={text:true};
function loadConfig(){
  try{const c=JSON.parse(localStorage.getItem("qual_ai_config")||"{}");
    let pf=c.provider||c.platform||"volcengine";
    /* 兼容旧 key 'tencent'，已统一为 hunyuan */
    if(pf==='tencent' && !AI_PLATFORMS.tencent){ pf='hunyuan'; }
    aiConfig.platform=pf;
    aiConfig.apiKey=c.key||c.apiKey||"";
    aiConfig.model=c.model||"";
  }catch(e){}
  try{const s=JSON.parse(localStorage.getItem("qual_search_config")||"{}");
    searchConfig.provider=s.provider||"bocha";
    searchConfig.key=s.key||DEFAULT_SEARCH_KEY;
  }catch(e){}
  searchConfig.key=searchConfig.key||DEFAULT_SEARCH_KEY;
  aiConfig.platform=aiConfig.platform||"volcengine";
  aiConfig.model=aiConfig.model||"doubao-seed-2-1-pro-260628";
  aiConfig.apiKey=aiConfig.apiKey||DEFAULT_AI_KEY;
}
// ========== 数据层（GitHub 共享 + 本地录入双层） ==========
// 共享层：public/data/qualification-data.json（GitHub 仓库，团队只读）
// 本地层：localStorage qref_local_data（个人录入，可导出提交共享库）
const SHARED_DATA_URL="../../data/qualification-data.json";
const LS_SHARED_CACHE="qref_shared_cache";
const LS_LOCAL_DATA="qref_local_data";
const CACHE_TTL=24*3600*1000;

function loadSharedCache(){
  try{const c=JSON.parse(localStorage.getItem(LS_SHARED_CACHE)||"null");
    if(c&&c.data)return c;
  }catch(e){}
  return null;
}
async function loadSharedData(){
  const cache=loadSharedCache();
  let freshData=null;
  try{
    const resp=await fetch(SHARED_DATA_URL+"?t="+Date.now());
    if(resp.ok){
      freshData=await resp.json();
      const cachedVer=cache&&cache.data&&cache.data._meta&&cache.data._meta.version;
      const freshVer=freshData&&freshData._meta&&freshData._meta.version;
      const expired=!cache||Date.now()-cache.ts>=CACHE_TTL;
      // 版本升级或缓存过期时立即刷新；否则继续用缓存保证速度
      if(expired||!cachedVer||cachedVer!==freshVer){
        localStorage.setItem(LS_SHARED_CACHE,JSON.stringify({ts:Date.now(),data:freshData}));
        return freshData;
      }
    }
  }catch(e){/* 本地 file:// 或离线，降级缓存 */}
  return cache?cache.data:(freshData||null);
}
function loadLocalData(){
  try{return JSON.parse(localStorage.getItem(LS_LOCAL_DATA)||"{}");}catch(e){return {};}
}
function saveLocalData(obj){
  localStorage.setItem(LS_LOCAL_DATA,JSON.stringify(obj));
}
function qualKey(provName,city,qualId,level,dist){
  return dist?provName+"_"+city+"_"+dist+"_"+qualId+"_"+level:provName+"_"+city+"_"+qualId+"_"+level;
}
// 政策过渡期等级降级映射：目标等级（新标准甲/乙级）查无数据时，回退到旧版对应等级沿用数据
// 改革对应：甲级=原一级；乙级=原二级+三级合并。数组按接近程度排序
const LEVEL_FALLBACK={"甲级":["一级","二级","三级"],"乙级":["二级","三级"]};
// 三级数据层级：区级 > 市级 > 国标（国家标准）。dist 可选，为空则跳过区级
async function getQualData(provName,city,qualId,level,dist){
  const shared=await loadSharedData();
  const local=loadLocalData();
  function queryOne(lv){
    const ck=qualKey(provName,city,qualId,lv,dist);
    const ckCity=qualKey(provName,city,qualId,lv);
    const dk="_default_"+qualId+"_"+lv;
    const base={ck,dk,level:lv,sharedVersion:(shared&&shared._meta&&shared._meta.version)||""};
    if(dist&&shared&&shared[ck])return Object.assign(base,{rec:shared[ck],source:"云端共享 · 区级数据",srcType:"cloud",scope:"区级"});
    if(shared&&shared[ckCity])return Object.assign(base,{rec:shared[ckCity],source:"云端共享 · 城市数据",srcType:"cloud",scope:"市级"});
    if(shared&&shared[dk])return Object.assign(base,{rec:shared[dk],source:"云端共享 · 国家标准",srcType:"cloud",scope:"国标"});
    if(dist&&local[ck])return Object.assign(base,{rec:local[ck],source:"本地录入 · 区级数据",srcType:"local",scope:"区级"});
    if(local[ckCity])return Object.assign(base,{rec:local[ckCity],source:"本地录入 · 城市数据",srcType:"local",scope:"市级"});
    if(local[dk])return Object.assign(base,{rec:local[dk],source:"本地录入 · 国家标准",srcType:"local",scope:"国标"});
    return Object.assign(base,{rec:null,source:"",srcType:"",scope:""});
  }
  const main=queryOne(level);
  if(main.rec)return Object.assign(main,{fallback:[]});
  const fallback=[];
  for(const lv of (LEVEL_FALLBACK[level]||[])){
    const r=queryOne(lv);
    if(r.rec)fallback.push(r);
  }
  return Object.assign(main,{fallback});
}
function downloadJSON(obj,filename){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function exportLocalData(){
  const local=loadLocalData();
  const keys=Object.keys(local).filter(k=>!k.startsWith("_"));
  const defKeys=Object.keys(local).filter(k=>k.startsWith("_default_"));
  if(!keys.length&&!defKeys.length){alert("本地暂无录入数据。首次查询某城市某资质时系统会自动生成录入草稿，确认保存后即可在此导出。");return;}
  const out={_meta:{
    exportedAt:new Date().toISOString().slice(0,10),
    from:"qualification 工具本地录入导出",
    keyRule:"区级 key = 省名_市名_区名_资质ID_等级；城市级 key = 省名_市名_资质ID_等级；_default_ 开头为国家标准（三级优先级：区级>市级>国标）",
    count:keys.length+defKeys.length,
    contributeNote:"将下方数据合并到仓库 public/data/qualification-data.json（保留原 _meta 与已有记录），更新 _meta.updatedAt/version 后提交即可全员共享"
  }};
  keys.forEach(k=>out[k]=local[k]);
  defKeys.forEach(k=>out[k]=local[k]);
  downloadJSON(out,"qualification-local-export.json");
  alert("已导出。请将导出的 JSON 内容合并提交到团队仓库 public/data/qualification-data.json，即可全员共享。");
}
// ========== 目录数据 ==========
const PROVINCES=[
  {code:"11",name:"北京市",cities:["北京市"]},{code:"12",name:"天津市",cities:["天津市"]},
  {code:"31",name:"上海市",cities:["上海市"]},{code:"50",name:"重庆市",cities:["重庆市"]},
  {code:"13",name:"河北省",cities:["石家庄市","唐山市","保定市","廊坊市"]},
  {code:"14",name:"山西省",cities:["太原市","大同市"]},

    basis:"《安全生产许可证条例》（国务院令第397号）、《建筑施工企业、工程项目安全生产管理机构设置及安全生产管理人员配备办法》（建质规〔2025〕3号）",

let state={step:1,prov:"",city:"",dist:"",catId:"",qualId:"",level:""};
const STEPS=[{n:1,t:"选择省份"},{n:2,t:"选择城市"},{n:3,t:"选择资质类别"},{n:4,t:"选择具体资质"},{n:5,t:"查看结果"}];
function renderSide(){
  const el=document.getElementById("sideNav");
  el.innerHTML=STEPS.map(s=>{
    const cls=state.step===s.n?"active":(state.step>s.n?"done":"");
    return `<div class="step-item ${cls}" onclick="goStep(${s.n})"><span class="num">${state.step>s.n?"✓":s.n}</span>${s.t}</div>`;
  }).join("");
}
function goStep(n){
  if(n>state.step&&!canGo(n))return;
  state.step=n;renderSide();renderMain();
}
function canGo(n){
  if(n===2)return !!state.prov;
  if(n===3)return !!state.city;
  if(n===4)return !!state.catId;
  if(n===5)return !!state.qualId&&!!state.level;
  return true;
}
function renderMain(){
  const el=document.getElementById("mainArea");
  if(state.step===1)el.innerHTML=renderStep1();
  else if(state.step===2)el.innerHTML=renderStep2();

  else if(state.step===4)el.innerHTML=renderStep4();
  else if(state.step===5)renderResult();
}

function renderRecCards(rec,provName,levelTag,srcBadge,isFallback,catId){
  const okText=isFallback
    ?`该资质在${provName}按现行沿用体系（旧版「${levelTag}」标准）可申请办理。当前处于资质改革过渡期（2026-2027），该地暂未发布新版「${state.level}」材料，旧版证书在过渡期内继续有效，企业可自愿申请按新标准换证。<br><span style="color:#B45309">注意：以下为旧版标准，与新版「${state.level}」条件不同，正式办理请以官方最新公告为准。</span>`
    :`该资质在${provName}可正常申请办理。审批权限：<b>${getApprover(provName)}</b>。当前处于资质改革过渡期，各地按新标准（甲/乙级）执行，原三级资质可换领乙级。<br><span style="color:#6b5d4a">具体是否在办以联网验证结果为准。</span>`;

  }

  const prompt=`请基于以下搜索结果，找出「${qual.name}${catLabel}（${lv}）」资质在「${provName}${state.city}」相关的最新政策文件信息。严格只输出一个 JSON 对象：{"policyNo":"最新政策文号（如 建市〔2014〕159号 / XX省住建厅XX号），搜不到填 未查到","title":"文件名称","org":"发布机构","date":"发布时间或公告时间"}。只基于搜索结果，不要编造。`;

function getApprover(provName){
  if(["北京市","天津市","上海市","重庆市"].includes(provName))return provName+"住建委（省级）";

// ========== 联网与 AI 工具函数 ==========
async function searchBocha(query){
  if(!searchConfig.key)throw new Error("未配置博查搜索 API Key");
  const resp=await fetch("https://api.bochaai.com/v1/web-search",{
    method:"POST",
    headers:{"Authorization":"Bearer "+searchConfig.key,"Content-Type":"application/json"},
    body:JSON.stringify({query:query,freshness:"oneYear",summary:true,count:8})
  });
  if(!resp.ok)throw new Error("搜索请求失败："+resp.status);
  const data=await resp.json();
  const wd=data.data||data;
  const arr=(wd.webPages&&wd.webPages.value)||[];
  return arr.map(v=>({title:v.name,url:v.url,summary:v.summary||v.snippet||"",date:v.datePublished||"",site:v.siteName||""}));
}
async function aiExtract(prompt,context){
  const pf=AI_PLATFORMS[aiConfig.platform]||AI_PLATFORMS.deepseek;
  const url=pf.url||aiConfig.baseUrl;
  const model=aiConfig.model||pf.models[0].id;
  if(!aiConfig.apiKey)throw new Error("未配置 AI API Key");
  const resp=await fetch(url,{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+aiConfig.apiKey},
    body:JSON.stringify({model:model,messages:[{role:"system",content:"你是建筑工程资质办理政策分析助手。基于用户提供的搜索结果提取信息，只提取不编造，搜不到的标注'未查到'。"},{role:"user",content:prompt+"\n\n搜索结果：\n"+context}],temperature:0.2,stream:false})
  });
  if(!resp.ok)throw new Error("AI 请求失败："+resp.status);
  const data=await resp.json();
  return data.choices[0].message.content;
}
function parseAIJson(text){
  if(!text)return null;
  try{return JSON.parse(text);}catch(e){}
  const m=text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(m){try{return JSON.parse(m[1]);}catch(e){}}
  const s=text.indexOf("{");
  const e2=text.lastIndexOf("}");
  if(s>=0&&e2>s){try{return JSON.parse(text.slice(s,e2+1));}catch(e){}}
  return null;
}
// ========== 生成记录 ==========
function saveRecord(){
  const {provName,cat,qual}=curInfo();
  const rec={time:Date.now(),prov:provName,city:state.city,dist:state.dist||"",qualName:qual.name,cat:cat.name,level:state.level};
  let list=[];
  try{list=JSON.parse(localStorage.getItem("qref_records_v1")||"[]");}catch(e){}
  list=list.filter(r=>!(r.prov===rec.prov&&r.city===rec.city&&(r.dist||"")===(rec.dist||"")&&r.qualName===rec.qualName&&r.level===rec.level));
  list.unshift(rec);
  if(list.length>30)list=list.slice(0,30);
  localStorage.setItem("qref_records_v1",JSON.stringify(list));
  alert("已保存到生成记录");
}

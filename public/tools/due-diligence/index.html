<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企业尽调报告生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#faf7f2;color:#2a2118;min-height:100vh}
header{background:linear-gradient(120deg,#fffdf9,#fdf3e3,#fbeccb);color:#2a2118;padding:16px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:19px;display:flex;align-items:center;gap:8px}
header .sub{font-size:12px;color:#6b5d4a}
header .save-state{margin-left:auto;font-size:12px;background:#fffefb;color:#6b5d4a;border:1px solid #ece3d6;border-radius:20px;padding:5px 14px}
header .save-state.saved{background:#e8f7ef;color:#1d7a46;border-color:#bfe6cf}
header .rec-btn{background:#fffefb;color:#2a2118;border:1px solid #ece3d6;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
header .rec-btn:hover{background:#fbf5ea;border-color:#e0901a}
/* 生成记录弹窗 */
.rec-bg{position:fixed;inset:0;background:rgba(42,26,10,.45);z-index:90;display:none}
.rec-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:14px;padding:20px 22px;width:580px;max-width:94vw;height:min(600px,86vh);z-index:91;display:none;flex-direction:column;box-shadow:0 10px 40px rgba(42,33,24,.18)}
.rec-modal h3{margin:0 0 12px;font-size:15.5px;color:#7a3e07}
.rec-body{flex:1;overflow:auto;min-height:0;padding-right:4px}
.rec-row{display:flex;align-items:center;gap:10px;border:1px solid #f2e6d8;border-radius:10px;padding:11px 13px;margin-bottom:10px;background:#fffefb}
.rec-row .rec-t{font-size:13.5px;font-weight:600;color:#2a2118;margin-bottom:3px}
.rec-row .rec-s{font-size:12px;color:#9a8a72}
.rec-ops{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.rec-badge{display:inline-block;font-size:10.5px;border-radius:9px;padding:1px 7px;margin-left:6px;vertical-align:1px;font-weight:600}
.rec-empty{background:#faf7f2;border-left:4px solid #9a8a72;border-radius:6px;padding:12px 14px;font-size:12.5px;color:#4a4035;line-height:1.7}
.rec-tip{font-size:12px;color:#9a8a72;margin-bottom:10px}
.rec-kv{display:flex;font-size:13px;padding:5px 0;border-bottom:1px dashed #f2e6d8}
.rec-kv .k{width:120px;color:#9a8a72;flex-shrink:0}
.rec-kv .v{color:#2a2118;word-break:break-all}
.wrap{max-width:1000px;margin:22px auto;padding:0 16px;display:flex;gap:18px;align-items:flex-start}
.side{width:238px;background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(180,120,40,.06);position:sticky;top:16px;flex-shrink:0}
.side .st-title{font-size:12px;color:#9a8a72;padding:4px 10px 8px;font-weight:600;letter-spacing:1px}
.side button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:none;padding:9px 10px;font-size:13px;border-radius:8px;color:#3a3228;cursor:pointer;margin-bottom:2px;font-family:inherit}
.side button .st-num{width:22px;height:22px;border-radius:50%;background:#f2e6d8;color:#6b5d4a;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700}
.side button.active{background:#e0901a;color:#fff;font-weight:bold}
.side button.active .st-num{background:#fff;color:#7a3e07}
.side button.done .st-num{background:#16A34A;color:#fff}
.side button.done::after{content:"✓";margin-left:auto;color:#16A34A;font-weight:bold}
.side button.active.done::after{color:#fff}
.main{flex:1;background:#fff;border-radius:12px;padding:26px 28px;box-shadow:0 1px 3px rgba(180,120,40,.06);min-height:560px}
.main h2{font-size:17px;color:#7a3e07;margin-bottom:4px}
.main .hint{font-size:12px;color:#9a8a72;margin-bottom:14px}
.step-help{background:#fdf6ec;border:1px solid #f3d9ab;border-left:4px solid #e0901a;border-radius:8px;padding:10px 13px;margin:6px 0 16px;font-size:12.5px;color:#6b3e07;line-height:1.85}
.step-help b{color:#a85509}
.frow{display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.fitem{flex:1;min-width:200px}
.fitem label{display:block;font-size:12.5px;color:#4a4035;margin-bottom:4px}
.fitem label .req{color:#DC2626;margin-left:2px}
.fitem input,.fitem select,.fitem textarea{width:100%;padding:8px 10px;border:1px solid #e8dcd0;border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff;color:#2a2118}
.fitem textarea{resize:vertical;min-height:64px;line-height:1.6}
.fitem input:focus,.fitem select:focus,.fitem textarea:focus{outline:2px solid #f3c98a;border-color:#f0a93c}
.fitem .src-note{display:block;font-size:11px;color:#9a8a72;margin:3px 0 0;line-height:1.5}
.sec-title{font-size:13.5px;color:#7a3e07;font-weight:700;margin:18px 0 10px;padding-left:8px;border-left:4px solid #e0901a}
.dyn-table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 6px}
.dyn-table th{background:#fdf4e6;color:#7a3e07;padding:7px 8px;text-align:left;font-weight:600;border-bottom:1px solid #e8dcd0;white-space:nowrap}
.dyn-table td{padding:5px 6px;border-bottom:1px solid #faf7f2}
.dyn-table td input,.dyn-table td select{width:100%;padding:6px 8px;border:1px solid #e8dcd0;border-radius:6px;font-size:12.5px;font-family:inherit}
.dyn-table td input:focus,.dyn-table td select:focus{outline:2px solid #f3c98a;border-color:#f0a93c}
.dyn-table .del-btn{border:none;background:#FEE2E2;color:#DC2626;border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.dyn-table .del-btn:hover{background:#FECACA}
.add-btn{border:1px dashed #f3c98a;background:#fdf4e6;color:#e0901a;border-radius:8px;padding:6px 14px;font-size:12.5px;cursor:pointer;font-family:inherit;margin:2px 0 4px}
.add-btn:hover{background:#fbeccb}
/* 版本选择 */
.ver-bar{display:flex;gap:10px;margin:2px 0 6px}
.ver-card{flex:1;border:2px solid #f2e6d8;border-radius:12px;padding:11px 14px;cursor:pointer;background:#fff;transition:.15s;text-align:left;font-family:inherit}
.ver-card:hover{border-color:#f3c98a}
.ver-card.active{border-color:#e0901a;background:#fdf4e6;box-shadow:0 2px 8px rgba(224,144,26,.15)}
.ver-card .vn{font-size:14.5px;font-weight:700;color:#2a2118;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ver-card.active .vn{color:#7a3e07}
.ver-card .vd{font-size:11.5px;color:#9a8a72;margin-top:3px;line-height:1.5}
.ver-card .badge{font-size:10px;background:#FEF3C7;color:#92400E;border-radius:10px;padding:1px 7px;font-weight:600}
.ver-card .soon{font-size:10px;background:#faf7f2;color:#9a8a72;border-radius:10px;padding:1px 7px;font-weight:600}
/* 截图槽 */
.shot-slot{background:#faf7f2;border:1px solid #f2e6d8;border-radius:10px;padding:11px 12px;margin-bottom:11px}
.shot-label{font-size:12.5px;color:#3a3228;font-weight:600;margin-bottom:8px}
.shot-label .req{color:#DC2626;margin-left:2px}
.shot-label .tag{font-size:10.5px;color:#9a8a72;font-weight:400;margin-left:6px}
.shot-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.shot-item{position:relative;border:1px solid #e8dcd0;border-radius:8px;overflow:hidden;background:#fff}
.shot-item img{display:block;height:76px;object-fit:cover}
.shot-del{position:absolute;top:2px;right:2px;border:none;background:rgba(220,38,38,.88);color:#fff;border-radius:50%;width:19px;height:19px;font-size:11px;cursor:pointer;line-height:1}
.shot-no{position:absolute;top:2px;left:2px;background:rgba(12,45,93,.82);color:#fff;border-radius:4px;font-size:10px;padding:1px 5px;line-height:1.4}
.shot-clear{margin-top:6px;border:1px solid #e8dcd0;background:#fff;color:#9a8a72;border-radius:6px;padding:4px 10px;font-size:11.5px;cursor:pointer;font-family:inherit}
.shot-clear:hover{border-color:#DC2626;color:#DC2626}
.risk-summary{margin-top:12px;padding:10px 14px;border-radius:8px;background:#fdf6ea;border:1px solid #ece3d6;font-size:13px;color:#2a2118}
.risk-summary b{color:#b45309;font-size:14px}
.risk-summary.empty{background:#f7f5f1;color:#9a8a72}
.shot-upload{border:1.5px dashed #f3c98a;background:#fdf4e6;color:#e0901a;border-radius:8px;padding:12px;text-align:center;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
.shot-upload:hover{border-color:#e0901a;background:#fbeccb}
/* 单选卡片 */
.radios{display:flex;gap:10px;margin-bottom:4px}
.radio-card{flex:1;border:2px solid #f2e6d8;border-radius:10px;padding:12px;text-align:center;cursor:pointer;font-size:13px;color:#4a4035;background:#fff;font-family:inherit;font-weight:600;transition:.15s}
.radio-card:hover{border-color:#f3c98a}
.radio-card.on{border-color:#e0901a;background:#fdf4e6;color:#7a3e07}
.tools{display:flex;gap:8px;margin-top:20px;align-items:center;flex-wrap:wrap}
.btn{border:none;border-radius:8px;padding:9px 20px;font-size:13.5px;cursor:pointer;font-family:inherit}
.btn-primary{background:#b45309;color:#fff}
.btn-primary:hover{background:#b45309}
.btn-green{background:#16A34A;color:#fff}
.btn-green:hover{background:#15803D}
.btn-ghost{background:#fffefb;color:#2a2118;border:1px solid #ece3d6}
.btn-ghost:hover{background:#fbf5ea;border-color:#e0901a}
.btn-danger{background:#FEE2E2;color:#DC2626}
.btn-danger:hover{background:#FECACA}
.spacer{flex:1}
/* 报告预览 */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0 18px}
.sum-card{background:#faf7f2;border:1px solid #f2e6d8;border-radius:10px;padding:11px 13px}
.sum-card .k{font-size:11.5px;color:#9a8a72;margin-bottom:4px}
.sum-card .v{font-size:14px;color:#2a2118;font-weight:600;word-break:break-all}
.gen-box{background:linear-gradient(135deg,#7a3e07,#e0901a);border-radius:12px;padding:22px;color:#fff;text-align:center;margin:8px 0 16px}
.gen-box .t{font-size:17px;font-weight:bold;margin-bottom:6px}
.gen-box .d{font-size:12.5px;opacity:.85;line-height:1.7}
.gen-box .btn{font-size:15px;padding:12px 32px;margin-top:14px;background:#fff;color:#7a3e07;font-weight:bold}
.gen-box .btn:hover{background:#fdf6ec}
.gen-box .btn:disabled{opacity:.6;cursor:not-allowed}
.report-struct{font-size:12.5px;color:#4a4035;line-height:1.9;background:#faf7f2;border-radius:10px;padding:14px 18px;border:1px solid #f2e6d8}
.report-struct b{color:#7a3e07}
.opt-note{font-size:11.5px;color:#9a8a72;margin-top:8px;line-height:1.6}
footer{text-align:center;color:#9a8a72;font-size:12px;padding:20px}
.notice{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:#2a2118;color:#fff;padding:9px 18px;border-radius:20px;font-size:12.5px;z-index:99;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 4px 14px rgba(42,33,24,.16)}
.notice.show{opacity:1}
/* 开票数据导入面板 */
.inv-box{background:#faf7f2;border:1px solid #f2e6d8;border-radius:10px;padding:12px 13px;margin-bottom:11px}
.inv-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.inv-title{font-size:13px;font-weight:700;color:#7a3e07}
.inv-meta{font-size:11px;color:#9a8a72}
.inv-upload{border:1.5px dashed #f3c98a;background:#fdf4e6;color:#e0901a;border-radius:8px;padding:16px;text-align:center;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
.inv-upload:hover{border-color:#e0901a;background:#fbeccb}
.inv-tip{font-size:11.5px;color:#9a8a72;line-height:1.75;margin-top:8px}
.inv-tip b{color:#b45309}
.inv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px;margin-bottom:10px}
.inv-card{background:#fff;border:1px solid #f2e6d8;border-radius:9px;padding:9px 11px}
.inv-card .k{font-size:11px;color:#9a8a72;margin-bottom:3px}
.inv-card .v{font-size:15px;color:#2a2118;font-weight:700;word-break:break-all}
.inv-card .v.sm{font-size:12.5px;font-weight:600}
.inv-card .v .u{font-size:11px;font-weight:400;color:#9a8a72;margin-left:2px}
.inv-card.hi{background:#fdf4e6;border-color:#f3c98a}
.inv-card.hi .v{color:#b45309}
.inv-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.inv-chip{font-size:11px;color:#7a3e07;background:#fdf4e6;border:1px solid #f3c98a;border-radius:20px;padding:3px 10px}
.inv-chip b{color:#b45309}
.inv-chip.gray{color:#6b7280;background:#fff;border-color:#ece3d6}
.inv-chip.gray b{color:#374151}
.inv-search{margin-bottom:8px}
.inv-search input{width:100%;box-sizing:border-box;border:1px solid #ece3d6;border-radius:8px;padding:7px 11px;font-size:12.5px;font-family:inherit;color:#2a2118;background:#fff}
.inv-scroll{max-height:340px;overflow:auto;border:1px solid #f2e6d8;border-radius:8px;background:#fff}
.inv-table{width:100%;border-collapse:collapse;font-size:11.5px}
.inv-table th{position:sticky;top:0;background:#fdf6ea;color:#7a3e07;font-weight:700;padding:7px 8px;text-align:left;border-bottom:1px solid #f2e6d8;white-space:nowrap;z-index:1}
.inv-table td{padding:6px 8px;border-bottom:1px solid #f7f1e8;color:#4a4035;vertical-align:top}
.inv-table tr:last-child td{border-bottom:none}
.inv-table tbody tr:hover{background:#fdfaf4}
.inv-table .c{text-align:center;white-space:nowrap}
.inv-table .r{text-align:right;white-space:nowrap}
.inv-table .b{font-weight:700;color:#2a2118}
.inv-table .mono{font-family:Consolas,Monaco,monospace;font-size:11px;color:#0C2D5D}
.inv-more{margin-top:8px;border:1px dashed #f3c98a;background:#fdf4e6;color:#e0901a;border-radius:8px;padding:6px 14px;font-size:12.5px;cursor:pointer;font-family:inherit}
.inv-more:hover{background:#fbeccb}
.inv-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.inv-actions .btn{padding:6px 14px;font-size:12.5px}
@media(max-width:760px){.wrap{flex-direction:column}.side{width:100%;position:static;display:flex;flex-wrap:wrap}.side button{width:auto}.side .st-title{display:none}.ver-bar{flex-direction:column}.inv-scroll{max-height:260px}}
</style>
</head>
<body>

<header>
  <h1>📄 企业尽调报告生成器</h1>
  <span class="sub">引导式尽调 · 一键生成正式 Word 报告</span>
  <button class="rec-btn" onclick="openRecords()">📋 生成记录</button>
  <span class="save-state" id="saveState">数据已自动保存</span>
</header>
<div class="rec-bg" id="recModalBg" onclick="closeRecModal()"></div>
<div class="rec-modal" id="recModal">
  <div class="rec-body" id="recModalBody"></div>
</div>

<div class="wrap">
  <aside class="side">
    <div class="st-title">尽调流程</div>
    <div id="stepNav"></div>
  </aside>

  <main class="main" id="mainArea"></main>
</div>

<footer>企业尽调报告生成器 · 填写的数据仅保存在当前浏览器</footer>
<div class="notice" id="notice"></div>

<script src="docx.umd.js"></script>
<script>
/* ================= 版本定义 ================= */
const VERSIONS = [
  { id:'basic',    name:'基础版', badge:'摸底尽调', desc:'股权结构、税局系统核查、账户开立、诉讼核查', ready:true },
  { id:'pro',      name:'专业版', badge:'深度尽调', desc:'十二章完整深度尽调：历史沿革、资质许可、财税、用工、资产、合同、诉讼、风险矩阵', ready:true },
  { id:'hightech', name:'高新版', badge:'',          desc:'高新/专精特新专项尽调（开发中，敬请期待）', ready:false }
]
const STEPS_BY_VERSION = {
  basic: [
    { id:'project', icon:'📋', title:'项目信息', desc:'委托方、目标公司与报告要素' },
    { id:'equity',  icon:'🏛️', title:'股权结构', desc:'公司章程 / 股权结构图截图' },
    { id:'finance', icon:'💰', title:'财务概况', desc:'电子税务局截图 + 社保/公积金/银行账户' },
    { id:'legal',   icon:'⚖️', title:'法律合规', desc:'未完成诉讼核查' },
    { id:'risk',    icon:'⚠️', title:'风险与结论', desc:'风险点、综合评估与调查结论' },
    { id:'report',  icon:'📄', title:'生成报告', desc:'一键生成并下载正式 Word 报告' }
  ],
  pro: [
    { id:'project',    icon:'📋', title:'项目信息',     desc:'委托方、目标公司、调查范围与方法' },
    { id:'company',    icon:'🏢', title:'公司基本情况', desc:'登记事项、经营范围、年报与实缴情况' },
    { id:'history',    icon:'🏛️', title:'历史沿革与股权', desc:'设立及历次变更、股东穿透、分支机构与对外投资、股权限制' },
    { id:'license',    icon:'📜', title:'资质与行政许可', desc:'目标资质清单、有效期、年检与许可条件符合性' },
    { id:'finance',    icon:'💰', title:'财务状况',     desc:'税局系统核查截图 + 近三年财务摘要 + 大额往来' },
    { id:'tax',        icon:'🧾', title:'税务合规',     desc:'纳税信用等级、欠税、税务稽查与处罚、税收优惠' },
    { id:'hr',         icon:'👥', title:'劳动用工',     desc:'员工人数、劳动合同、社保公积金、劳动争议与欠薪' },
    { id:'assets',     icon:'🧩', title:'资产与知识产权', desc:'商标/专利/著作权/域名、不动产与车辆' },
    { id:'contracts',  icon:'📑', title:'重大合同与债权债务', desc:'重大合同、借款、担保与抵押、对外担保' },
    { id:'litigation', icon:'⚖️', title:'诉讼仲裁与行政处罚', desc:'裁判文书、被执行人、失信限高、经营异常、行政处罚' },
    { id:'matrix',     icon:'📊', title:'风险矩阵与评分', desc:'八大类风险打分，自动汇总综合风险等级' },
    { id:'conclusion', icon:'📝', title:'结论与建议',   desc:'主要风险点、调查结论、交易建议与交割前置条件' },
    { id:'report',     icon:'📄', title:'生成报告',     desc:'一键生成并下载正式 Word 报告（十二章）' }
  ]
}
let STEPS = STEPS_BY_VERSION.basic

/* 截图槽位定义（基础版） */
const CAT_LABELS = {
  /* 基础版 */
  equity:'公司章程/股权结构图',
  fin_grade:'纳税人级别', fin_info:'纳税人信息', fin_violation:'违法违章记录', fin_cancel:'注销预检',
  fin_financial:'最新一期财务报表', fin_invoice:'发票界面', fin_invoiceData:'开票数据', fin_taxData:'纳税数据',
  legal_nolawsuit:'无诉讼证明',
  /* 专业版：公司基本情况 */
  comp_license:'营业执照', comp_public:'工商公示信息',
  /* 专业版：历史沿革与股权 */
  hist_change:'工商变更记录', hist_shareholder:'股东及出资信息', hist_pledge:'股权出质/冻结查询',
  /* 专业版：资质与行政许可 */
  lic_cert:'资质/许可证书', lic_check:'资质年检或延续记录',
  /* 专业版：财务（补充） */

/* 图片处理：压缩至合适尺寸，返回 dataUrl + 尺寸 + 类型 */
function processImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader()
    reader.onload=()=>{
      const img=new Image()
      img.onload=()=>{
        let { width, height }=img
        const MAX=1400
        if(width>MAX||height>MAX){
          const s=Math.min(MAX/width,MAX/height)
          width=Math.round(width*s); height=Math.round(height*s)
        }
        const canvas=document.createElement('canvas')
        canvas.width=width; canvas.height=height
        canvas.getContext('2d').drawImage(img,0,0,width,height)
        const isPng=file.type==='image/png'
        const dataUrl=canvas.toDataURL(isPng?'image/png':'image/jpeg',0.9)
        resolve({ dataUrl, w:width, h:height, type:isPng?'png':'jpg' })
      }
      img.onerror=()=>reject(new Error('图片解码失败'))
      img.src=reader.result
    }
    reader.onerror=()=>reject(new Error('文件读取失败'))
    reader.readAsDataURL(file)
  })
}

/* ================= 全量发票导入（税局导出的 .xlsx） =================
   零依赖实现：xlsx 本质是 zip，浏览器原生 DecompressionStream 即可解压，
   税局导出文件多用 inlineStr 内联字符串，亦兼容 sharedStrings。          */
function xmlUnesc(s){
  return String(s==null?'':s)
    .replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCodePoint(parseInt(h,16)))
    .replace(/&#(\d+);/g,(_,n)=>String.fromCodePoint(+n))
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")
    .replace(/&amp;/g,'&')
}
async function xlsxUnzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf)
  let eocd=-1
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-22-65536);i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break }
  }
  if(eocd<0) throw new Error('不是有效的 xlsx 文件（文件可能已损坏或不是 Excel 格式）')
  const count=dv.getUint16(eocd+10,true)
  let off=dv.getUint32(eocd+16,true)
  const entries=[]
  for(let i=0;i<count;i++){
    if(dv.getUint32(off,true)!==0x02014b50) break
    const method=dv.getUint16(off+10,true)
    const csize=dv.getUint32(off+20,true)
    const nlen=dv.getUint16(off+28,true), elen=dv.getUint16(off+30,true), clen=dv.getUint16(off+32,true)
    const lho=dv.getUint32(off+42,true)
    const name=new TextDecoder().decode(u8.subarray(off+46,off+46+nlen))
    entries.push({name,method,csize,lho})
    off+=46+nlen+elen+clen
  }
  const out={}
  for(const f of entries){
    const lnl=dv.getUint16(f.lho+26,true), lel=dv.getUint16(f.lho+28,true)
    const start=f.lho+30+lnl+lel
    const data=u8.subarray(start,start+f.csize)
    if(f.method===0){ out[f.name]=data }
    else if(f.method===8){
      if(typeof DecompressionStream==='undefined') throw new Error('当前浏览器不支持解压，请使用较新版本的 Chrome 或 Edge 浏览器')
      const stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))
      out[f.name]=new Uint8Array(await new Response(stream).arrayBuffer())
    }
  }
  return out
}
function xlsxCellText(xml){
  return xmlUnesc((xml.match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[]).map(x=>x.replace(/<[^>]+>/g,'')).join('')).trim()
}
function sheetRows(xml, shared){
  const rows=[], rowRe=/<row[^>]*>([\s\S]*?)<\/row>/g
  let m
  while((m=rowRe.exec(xml))){
    const cells={}, cRe=/<c\s+([^>]*?)\/>|<c\s+([^>]*?)>([\s\S]*?)<\/c>/g
    let cm
    while((cm=cRe.exec(m[1]))){
      const attrs=cm[1]||cm[2]||'', inner=cm[3]||''
      const rM=attrs.match(/r="([A-Z]+)\d+"/)
      if(!rM) continue
      const tM=attrs.match(/t="([^"]+)"/), t=tM?tM[1]:''
      let v=''
      if(t==='inlineStr'){ v=xlsxCellText(inner) }
      else{
        const vm=inner.match(/<v>([\s\S]*?)<\/v>/)
        if(vm){ v=xmlUnesc(vm[1]); if(t==='s') v=shared[parseInt(v,10)]||'' }
      }
      cells[rM[1]]=v.trim()
    }
    if(Object.keys(cells).length) rows.push(cells)
  }
  return rows
}
async function readXlsx(buf){
  const files=await xlsxUnzip(buf), dec=new TextDecoder('utf-8')
  const shared=[]
  if(files['xl/sharedStrings.xml']){
    const xml=dec.decode(files['xl/sharedStrings.xml']), siRe=/<si>([\s\S]*?)<\/si>/g
    let m
    while((m=siRe.exec(xml))) shared.push(xlsxCellText(m[1]))
  }
  const rels={}
  if(files['xl/_rels/workbook.xml.rels']){
    const relXml=dec.decode(files['xl/_rels/workbook.xml.rels']), re=/<Relationship\s+([^>]*?)\/?>/g
    let m
    while((m=re.exec(relXml))){
      const id=(m[1].match(/Id="([^"]+)"/)||[])[1], target=(m[1].match(/Target="([^"]+)"/)||[])[1]
      if(id&&target) rels[id]=target
    }
  }
  const wbXml=dec.decode(files['xl/workbook.xml']), sheets=[], shRe=/<sheet\s+([^>]*?)\/?>/g
  let m
  while((m=shRe.exec(wbXml))){
    const name=xmlUnesc((m[1].match(/name="([^"]+)"/)||[])[1]||'')
    const rid=(m[1].match(/r:id="([^"]+)"/)||[])[1]
    let target=rels[rid]||''
    if(target){ target=target.replace(/^\//,''); if(!/^xl\//.test(target)) target='xl/'+target }
    if(name&&target&&files[target]) sheets.push({name, xml:dec.decode(files[target])})
  }
  if(!sheets.length) throw new Error('未在文件中找到任何工作表')
  return { sheets, shared }
}
/* 列名别名表：兼容不同省份电子税务局的表头差异 */
const INV_COLS = {
  sn:['序号'],
  no:['数电发票号码','全电发票号码','电子发票号码','发票号码'],
  code:['发票代码'],
  sellerCode:['销方识别号','销方纳税人识别号','销售方识别号','销售方纳税人识别号'],
  seller:['销方名称','销售方名称','销方','销售方'],
  buyerCode:['购方识别号','购买方识别号','购方纳税人识别号','购买方纳税人识别号'],
  buyer:['购买方名称','购方名称','购买方','购方'],
  date:['开票日期'],
  amount:['金额','不含税金额','金额(不含税)'],
  tax:['税额'],
  total:['价税合计','合计金额','含税金额'],
  source:['发票来源'],
  type:['发票票种','发票种类','票种'],
  status:['发票状态','状态'],
  positive:['是否正数发票'],
  risk:['发票风险等级','风险等级'],
  drawer:['开票人'],
  remark:['备注']
}
const INV_MAX = 3000   /* 最多保留的发票条数，超出部分截断（避免撑爆本地存储） */
const INV_WORD_ROWS = 200  /* Word 报告最多列示的明细条数，超出则按价税合计取前 N 大 */
async function importInvoices(file){
  if(!file) return
  if(!/\.xlsx$/i.test(file.name||'')) { alert('请上传 .xlsx 格式的税局导出文件（如是 .xls 请先用 Excel 另存为 .xlsx）'); return }
  const { sheets, shared } = await readXlsx(await file.arrayBuffer())
  /* 选表：优先「发票基础信息」（一票一行，最干净），其次「信息汇总表」，最后取第一个 */
  let sheet = sheets.find(s=>s.name.indexOf('发票基础信息')>=0)
             || sheets.find(s=>s.name.indexOf('发票')>=0)
             || sheets[0]
  const rows = sheetRows(sheet.xml, shared)
  if(!rows.length) throw new Error('工作表「'+sheet.name+'」为空')
  /* 找表头行：前 8 行内包含发票号码或价税合计的那一行 */
  let hi = -1
  for(let i=0;i<Math.min(8,rows.length);i++){
    const vals = Object.values(rows[i]).join('|')
    if(/数电发票号码|发票号码/.test(vals) || /价税合计/.test(vals)) { hi = i; break }
  }
  if(hi<0) throw new Error('未识别到发票表头，请确认导入的是电子税务局「全量发票查询」导出的原始文件（不要改动表头）')
  const head = rows[hi]
  const colOf = {}
  Object.keys(head).forEach(c=>{ colOf[String(head[c]).trim()] = c })
  /* 表头名 → 字段 */
  const map = {}
  Object.keys(INV_COLS).forEach(f=>{
    for(const alias of INV_COLS[f]){
      if(colOf[alias]!=null){ map[f]=colOf[alias]; break }
    }
  })
  if(map.no==null && map.seller==null && map.buyer==null)
    throw new Error('未识别到发票号码/销方/购方等必要列，请导入原始导出文件')
  const get=(r,f)=> map[f]!=null ? String(r[map[f]]||'').trim() : ''
  const list=[], seen={}
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]
    const noV=get(r,'no'), codeV=get(r,'code')
    const key=noV || codeV || ''
    const seller=get(r,'seller'), buyer=get(r,'buyer')
    const sn=get(r,'sn')
    /* 跳过合计行 / 小计行 / 空行（税局导出文件末尾通常带「合计行」） */
    if(/合计|小计|总计|汇总/.test(sn)) continue
    if(!key && !seller && !buyer) continue
    if(key && seen[key]) continue          /* 信息汇总表一票多货 → 去重 */
    if(key) seen[key]=1
    const o=Object.assign({}, INV_TPL)
    Object.keys(INV_TPL).forEach(f=>{ o[f]=get(r,f) })
    o.date=(o.date||'').replace(/\s+\d{1,2}:\d{1,2}(:\d{1,2})?$/,'').trim()
    list.push(o)
    if(list.length>=INV_MAX) break
  }
  if(!list.length) throw new Error('未读到任何发票记录，请确认导出文件中含有发票数据')
  /* 开票期间 */
  const ds=list.map(x=>(x.date||'').slice(0,10)).filter(Boolean).sort()
  const period = ds.length ? (ds[0]===(ds[ds.length-1]) ? ds[0] : ds[0]+' ~ '+ds[ds.length-1]) : ''
  state.finance.invoices = list
  state.finance.invoiceMeta = { file:file.name||'', sheet:sheet.name, at:today(), period:period }
  const saved=saveState()
  return { count:list.length, sheet:sheet.name, saved:!!saved, truncated: rows.length-1-hi > INV_MAX }
}
/* 发票汇总统计 */
function invStats(list){
  list = list || state.finance.invoices || []
  const n=v=>parseFloat(String(v||'').replace(/,/g,''))||0
  let amount=0, tax=0, total=0
  const byType={}, byStatus={}
  list.forEach(x=>{
    amount+=n(x.amount); tax+=n(x.tax); total+=n(x.total)
    const t=x.type||'未标注'; byType[t]=(byType[t]||0)+1
    const s=x.status||'未标注'; byStatus[s]=(byStatus[s]||0)+1
  })
  const top=o=>Object.keys(o).map(k=>[k,o[k]]).sort((a,b)=>b[1]-a[1])
  return { count:list.length, amount, tax, total, byType:top(byType), byStatus:top(byStatus) }
}
const money=v=>{
  const n=parseFloat(String(v||'').replace(/,/g,''))||0
  return n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})
}

async function doImportInvoice(file){
  try{
    const r=await importInvoices(file)
    if(!r) return
    _invAll=false; _invQ=''
    renderStep()
    let msg='已导入 '+r.count+' 条发票（工作表「'+r.sheet+'」）'
    if(r.truncated) msg+='，超出 '+INV_MAX+' 条部分已截断'
    if(!r.saved) msg+='。⚠ 数据量超出浏览器本地存储上限，本次未自动保存，请先删减截图或改用首页「本地文件夹同步」后再导入'
    flash(msg)
    if(!r.saved) setTimeout(()=>alert(msg), 60)
  }catch(err){
    console.error('[发票导入]', err)
    alert('发票导入失败：'+(err && err.message || err))
  }
}

  if(ver){ setVersion(ver.dataset.ver); return }

  const radio=e.target.closest('[data-radio]')

    return
  }
  /* 截图槽：点击上传 */
  const up=e.target.closest('[data-shot]')
  if(up){
    const cat=up.dataset.shot
    const fi=document.createElement('input')
    fi.type='file'; fi.accept='image/*'
    fi.onchange=()=>{ for(const f of fi.files) addShot(cat,f) }
    fi.click()
    return
  }
  /* 清空某个环节的全部截图 */
  const shotClear=e.target.closest('[data-shot-clear]')
  if(shotClear){
    const cat=shotClear.dataset.shotClear
    if(!confirm('确定清空该环节已上传的全部截图吗？此操作不可撤销。')) return
    state.attachments.items=state.attachments.items.filter(x=>x.category!==cat)
    saveState(); renderStep()
    return
  }
  /* 截图删除 */
  const shotDel=e.target.closest('[data-shot-del]')
  if(shotDel){
    const [cat,idx]=shotDel.dataset.shotDel.split('.')
    const list=shotsOf(cat)
    state.attachments.items=state.attachments.items.filter(x=>!(x.category===cat && list[+idx] && x.id===list[+idx].id))
    saveState(); renderStep()
    return
  }
  /* 动态表格行删除 */
  const del=e.target.closest('[data-del]')
  if(del){
    const [g,k,ri]=del.dataset.del.split('.')
    const arr=state[g][k]
    if(arr.length<=1){ alert('至少保留一行'); return }
    arr.splice(+ri,1); saveState(); renderStep()
    return
  }
  /* 动态表格行新增 */
  const add=e.target.closest('[data-add]')
  if(add){
    const [g,k]=add.dataset.add.split('.')
    const tmpl=emptyState()[g][k]
    state[g][k].push(JSON.parse(JSON.stringify(tmpl)))
    saveState(); renderStep()
    return
  }
})
/* 全局粘贴：分配到当前步骤的第一个空截图槽 */
document.addEventListener('paste', e=>{
  const stepId=STEPS[currentStep].id
  const cats=catsOfStep(stepId)
  if(!cats || !cats.length) return
  /* 法律合规步骤：无诉讼槽仅在选"否"时有效 */
  if(stepId==='legal' && state.legal.hasLawsuit!=='否') return
  const items=e.clipboardData && e.clipboardData.items
  if(!items) return
  for(const it of items){
    if(it.type.startsWith('image/')){
      e.preventDefault()
      const file=it.getAsFile()
      if(!file) return
      /* 优先填第一个还空着的环节；若本步各环节都已有图，则续接到最近一次上传的环节 */
      let cat=null
      for(const c of cats){ if(!shotsOf(c).length){ cat=c; break } }
      if(!cat) cat=(_lastShotCat && cats.indexOf(_lastShotCat)>=0) ? _lastShotCat : cats[0]
      addShot(cat,file)
      flash('已粘贴到：'+(CAT_LABELS[cat]||cat))
      return
    }
  }
})

function stepContent(i){
  const s=STEPS[i]
  let html=`<h2>${s.icon} ${s.title}</h2><p class="hint">${s.desc}</p>`
  if(i===0) html+=versionBar()
  switch(s.id){
    case 'project':    html+=stepProject(); break
    case 'equity':     html+=stepEquity(); break
    case 'finance':    html+=stepFinance(); break
    case 'legal':      html+=stepLegal(); break
    case 'risk':       html+=stepRisk(); break
    case 'report':     html+=stepReport(); break
    /* 专业版 */
    case 'company':    html+=stepCompany(); break
    case 'history':    html+=stepHistory(); break
    case 'license':    html+=stepLicense(); break
    case 'tax':        html+=stepTax(); break
    case 'hr':         html+=stepHR(); break
    case 'assets':     html+=stepAssets(); break
    case 'contracts':  html+=stepContracts(); break
    case 'litigation': html+=stepLitigation(); break
    case 'matrix':     html+=stepMatrix(); break
    case 'conclusion': html+=stepConclusion(); break
  }
  /* 底部操作按钮 */
  html+=`<div class="tools">`
  if(i>0) html+=`<button class="btn btn-ghost" id="btnPrev">← 上一步</button>`
  if(i<STEPS.length-1) html+=`<span class="spacer"></span><button class="btn btn-primary" id="btnNext">下一步 →</button>`
  if(i===STEPS.length-1) html+=`<span class="spacer"></span>`
  html+=`<button class="btn btn-danger" id="btnReset" style="margin-left:auto">清空重填</button>`
  html+=`</div>`
  return html
}

/* ================= 专业版：风险矩阵定义 ================= */
const RISK_LEVELS = ['低风险','较低风险','中等风险','较高风险','高风险']
const RISK_SCORE  = { '低风险':1,'较低风险':2,'中等风险':3,'较高风险':4,'高风险':5 }
const RISK_CATS = [
  { k:'company',  label:'工商与主体资格' },
  { k:'equity',   label:'股权结构与沿革' },
  { k:'finance',  label:'财务与经营状况' },
  { k:'tax',      label:'税务合规' },
  { k:'legal',    label:'诉讼与行政处罚' },
  { k:'license',  label:'资质与行政许可' },
  { k:'hr',       label:'劳动用工' },
  { k:'contract', label:'合同与债权债务' }
]
/* 八大类打分 → 综合风险等级（取已打分项的平均值） */
function riskOverall(scores){
  let sum=0, n=0
  RISK_CATS.forEach(c=>{ const v=RISK_SCORE[scores&&scores[c.k]]; if(v){ sum+=v; n++ } })
  if(!n) return ''
  const avg=sum/n
  if(avg<=1.5) return '整体风险较低'
  if(avg<=2.5) return '整体风险可控'
  if(avg<=3.5) return '整体风险中等'
  if(avg<=4.5) return '整体风险较高'
  return '整体风险高，需审慎决策'
}

function renderStep(){
  const area=document.getElementById('mainArea')
  try{
    area.innerHTML=stepContent(currentStep)
  }catch(err){
    console.error('步骤渲染失败:', err)
    area.innerHTML=`<div class="step-help" style="color:#DC2626"><b>⚠ 页面渲染出错：</b>${esc(err.message)}<br>请点击「清空重填」重置数据后重试。</div>`
  }
  const prev=document.getElementById('btnPrev')
  const next=document.getElementById('btnNext')
  if(prev) prev.onclick=()=>{ currentStep--; renderNav(); renderStep() }
  if(next) next.onclick=()=>{
    if(!validate(currentStep)) return
    doneSteps.add(currentStep)
    currentStep++; renderNav(); renderStep()
  }
  const reset=document.getElementById('btnReset')
  if(reset) reset.onclick=resetState
}

function validate(i){
  const s=STEPS[i].id
  const miss=[]
  if(s==='project'){
    if(!String(state.project.company||'').trim()) miss.push('目标公司名称')
    if(!String(state.project.client||'').trim()) miss.push('委托方名称')
    if(!String(state.project.baseDate||'').trim()) miss.push('调查基准日')
  }
  if(s==='equity'){
    if(!shotsOf('equity').length) miss.push('公司章程/股权结构图截图（至少 1 张）')
  }
  if(s==='finance'){
    const slots=(state.version==='pro') ? FIN_SLOTS.filter(x=>x.cat!=='fin_invoiceData') : FIN_SLOTS
    slots.forEach(sl=>{ if(!shotsOf(sl.cat).length) miss.push('财务截图：'+sl.label) })
    /* 专业版：开票数据改为导入税局全量发票 */
    if(state.version==='pro' && !(state.finance.invoices||[]).length) miss.push('开票数据：需导入税局「全量发票查询」导出的 .xlsx 文件')
    const ac=state.finance.accounts
    if(!ac.social) miss.push('社保账户开通情况')
    if(!ac.housing) miss.push('公积金账户开通情况')
    if(!ac.bank) miss.push('银行账户开通情况')
    if(ac.bank==='有' && !String(ac.bankName||'').trim()) miss.push('银行名称（银行账户选「有」时）')
  }
  if(s==='legal'){
    if(!state.legal.hasLawsuit) miss.push('是否存在未完成诉讼')
    else if(state.legal.hasLawsuit==='否' && !shotsOf('legal_nolawsuit').length) miss.push('无诉讼证明截图')
    else if(state.legal.hasLawsuit==='是'){
      const ls=state.legal.lawsuits.filter(x=>String(x.no||'').trim()||String(x.cause||'').trim())
      if(!ls.length) miss.push('未完成诉讼案件详情（至少 1 行）')
    }
  }
  if(s==='risk' || s==='conclusion'){
    if(!state.risk.overall) miss.push('整体风险评估')
    if(!String(state.risk.conclusion||'').trim()) miss.push('调查结论')
    if(!String(state.risk.advice||'').trim()) miss.push('交易/合作建议')
  }
  /* ===== 专业版 ===== */
  if(s==='company'){
    if(!shotsOf('comp_license').length) miss.push('营业执照截图')
    if(!shotsOf('comp_public').length) miss.push('工商公示信息截图')
  }
  if(s==='history'){
    if(!shotsOf('hist_change').length) miss.push('工商变更记录截图')
    if(!shotsOf('hist_shareholder').length) miss.push('股东及出资信息截图')
    const sh=state.history.shareholders.filter(x=>String(x.name||'').trim())
    if(!sh.length) miss.push('股东及出资情况（至少 1 行）')
  }
  if(s==='license'){
    if(!shotsOf('lic_cert').length) miss.push('资质/许可证书截图')
    const it=state.license.items.filter(x=>String(x.name||'').trim())
    if(!it.length) miss.push('资质/许可清单（至少 1 行；如无资质请填「无」）')
  }
  if(s==='tax'){
    if(!shotsOf('tax_credit').length) miss.push('纳税信用等级查询截图')
    const t=state.tax
    if(!t.creditGrade) miss.push('纳税信用等级')
    if(!t.oweTax) miss.push('是否存在欠税')
  }
  if(s==='litigation'){
    if(!state.legal.hasLawsuit) miss.push('是否存在未完成诉讼')
    else if(state.legal.hasLawsuit==='是'){
      const ls=state.legal.lawsuits.filter(x=>String(x.no||'').trim()||String(x.cause||'').trim())
      if(!ls.length) miss.push('未完成诉讼案件详情（至少 1 行）')
    }
    if(!shotsOf('lit_judgment').length) miss.push('裁判文书查询截图')
    if(!shotsOf('lit_executed').length) miss.push('被执行人查询截图')
  }
  if(s==='matrix'){
    const sc=state.risk.scores||{}
    const done=RISK_CATS.filter(c=>sc[c.k])
    if(done.length<RISK_CATS.length) miss.push('八大类风险定级（还有 '+(RISK_CATS.length-done.length)+' 类未评）')
  }
  if(miss.length){ alert('请先完成以下必填项：\n· '+miss.join('\n· ')); return false }
  return true
}

/* ================= Word 报告生成 ================= */
const { Document, Packer, Paragraph, TextRun, AlignmentType, Table, TableRow, TableCell, WidthType, BorderStyle, Header, Footer, PageNumber, PageBreak, ShadingType, VerticalAlign, convertInchesToTwip, ImageRun, TabStopType, TabStopPosition } = docx

/* dataUrl → Uint8Array（docx 图片数据） */
function dataUrlToBytes(dataUrl){
  const b64=dataUrl.split(',')[1]
  const bin=atob(b64)
  const bytes=new Uint8Array(bin.length)
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i)
  return bytes
}

/* 字体工具（标题微软雅黑 → 更具科技感；正文宋体保持正式） */
const F = {
  song:  { ascii:'Times New Roman', hAnsi:'Times New Roman', eastAsia:'宋体' },
  hei:   { ascii:'Arial', hAnsi:'Arial', eastAsia:'微软雅黑' },
  yahei: { ascii:'Arial', hAnsi:'Arial', eastAsia:'微软雅黑' }
}
/* 品牌色板（深空蓝 × 科技青） */
const C = {
  primary:'0C2D5D',   /* 深空蓝 · 主色 */
  deep:'08203F',      /* 幽蓝 · 封面色带 */
  accent:'00A3E0',    /* 科技青 · 强调线/标记 */
  head:'0C2D5D',      /* 表头底色 */
  band:'EAF3FB',      /* 标签列浅蓝 */
  zebra:'F5F9FD',     /* 数据行斑马纹 */
  line:'8FB4D9',      /* 表格边框蓝 */
  gray:'7F8C99'
}
/* 单元格内边距（twip） */
const CELL_MAR = { top:80, bottom:80, left:120, right:120 }
/* 表格边框：外框细蓝，内线极浅 */
const TABLE_BORDERS = {
  top:{style:BorderStyle.SINGLE,size:6,color:C.line}, bottom:{style:BorderStyle.SINGLE,size:6,color:C.line},
  left:{style:BorderStyle.SINGLE,size:6,color:C.line}, right:{style:BorderStyle.SINGLE,size:6,color:C.line},
  insideHorizontal:{style:BorderStyle.SINGLE,size:4,color:'CBDDEC'}, insideVertical:{style:BorderStyle.SINGLE,size:4,color:'CBDDEC'}
}
function withBorders(table){ table.borders = TABLE_BORDERS; return table }

function r(text, opts={}){
  return new TextRun({ text:String(text??''), font:opts.font||F.song, size:opts.size||24, bold:opts.bold, italics:opts.italics, color:opts.color, break:opts.brk, characterSpacing:opts.csp })
}
function p(children, opts={}){
  return new Paragraph({
    children:Array.isArray(children)?children:[children],
    alignment:opts.align, spacing:opts.spacing||{ line:360, lineRule:'auto', before:opts.before||0, after:opts.after||0 },
    indent:opts.indent, keepNext:opts.keepNext, border:opts.border
  })
}
/* 正文叙述段：两端对齐 + 首行缩进两字符 */
function body(text){
  return p(r(String(text??'')),{ align:AlignmentType.JUSTIFIED, indent:{ firstLine:480 } })
}
/* 表格内单元格文字 */
function cellText(txt, o={}){
  return p(r(txt,{ font:o.font||F.song, size:o.size||21, bold:o.bold, color:o.color }),{
    spacing:{ line:300, lineRule:'auto', after:o.after!=null?o.after:40, before:o.before!=null?o.before:40 },
    alignment:o.align
  })
}
/* 章节标题：青色方块标记 + 深蓝雅黑 + 浅蓝横幅 + 青色下划线 */
function H1(text){
  return new Paragraph({
    children:[
      r('■ ',{font:F.yahei,size:26,bold:true,color:C.accent}),
      r(text,{font:F.yahei,size:32,bold:true,color:C.primary})
    ],
    spacing:{ before:420, after:220, line:360, lineRule:'auto' }, keepNext:true,
    shading:{ fill:'EDF4FB', type:ShadingType.CLEAR },
    border:{ left:{ style:BorderStyle.SINGLE, size:28, color:C.accent, space:6 },
             bottom:{ style:BorderStyle.SINGLE, size:6, color:C.accent, space:2 } }
  })
}
/* 小节标题：青色竖条标记 + 深蓝雅黑 */
function H2(text){
  return new Paragraph({
    children:[
      r('▎',{font:F.yahei,size:32,bold:true,color:C.accent}),
      r(' '+text,{font:F.yahei,size:26,bold:true,color:C.primary})
    ],
    spacing:{ before:280, after:140, line:340, lineRule:'auto' }, keepNext:true
  })
}
/* 键值表：左列蓝底黑体标签 */
function KVTable(rows, widths){
  const w=widths||[32,68]
  return withBorders(new Table({
    width:{ size:100, type:WidthType.PERCENTAGE },
    rows: rows.map((row,i)=>new TableRow({
      children:[
        new TableCell({ width:{size:w[0],type:WidthType.PERCENTAGE}, margins:CELL_MAR, shading:{fill:C.band,type:ShadingType.CLEAR}, verticalAlign:VerticalAlign.CENTER,
          children:[cellText(row[0],{font:F.hei,bold:true,color:C.primary})] }),
        new TableCell({ width:{size:w[1],type:WidthType.PERCENTAGE}, margins:CELL_MAR, shading:i%2?{fill:C.zebra,type:ShadingType.CLEAR}:undefined, verticalAlign:VerticalAlign.CENTER,
          children:[cellText(row[1])] })
      ]
    }))
  }))
}
/* 数据表：深蓝表头白字 + 斑马纹；aligns 控制各列对齐（left/center） */
function DataTable(headers, rows, aligns){
  const cols=headers.length
  const defAlign=(i)=>Array.isArray(aligns)?(aligns[i]||'left'):(i===0?'left':'center')
  return withBorders(new Table({
    width:{ size:100, type:WidthType.PERCENTAGE },
    rows:[
      new TableRow({ tableHeader:true, children: headers.map(h=>new TableCell({
        margins:CELL_MAR, shading:{fill:C.head,type:ShadingType.CLEAR}, verticalAlign:VerticalAlign.CENTER,
        children:[cellText(h,{font:F.hei,bold:true,color:'FFFFFF',align:AlignmentType.CENTER})]
      })) }),
      ...rows.map((cells,ri)=>new TableRow({ children: cells.map((c,ci)=>new TableCell({
        margins:CELL_MAR, shading:ri%2?{fill:C.zebra,type:ShadingType.CLEAR}:undefined, verticalAlign:VerticalAlign.CENTER,
        children:[cellText(c,{align:defAlign(ci)==='center'?AlignmentType.CENTER:AlignmentType.LEFT})]
      })) }))
    ]
  }))
}
function fieldRows(obj){
  const m=[
    ['公司名称',obj.company],['统一社会信用代码',obj.creditCode],['法定代表人',obj.legalRep],
    ['注册资本（万元）',obj.regCapital],['成立日期',obj.founded],['注册地址',obj.address],
    ['调查基准日',obj.baseDate],['报告编号',obj.reportNo]
  ]
  return m.map(([k,v])=>[k, v||'—'])
}

/* 截图相框：标题 + 1x1 表格相框（浅蓝边框+内边距+居中图片）+ 图注 */
function shotBlock(title, it){
  const arr=[]
  arr.push(H2(title))
  if(it && it.dataUrl){
    let iw=it.w||600, ih=it.h||400
    const MAXW=520
    if(iw>MAXW){ ih=Math.round(ih*MAXW/iw); iw=MAXW }
    const FRAME={ top:{style:BorderStyle.SINGLE,size:12,color:C.accent}, bottom:{style:BorderStyle.SINGLE,size:4,color:C.line},
      left:{style:BorderStyle.SINGLE,size:4,color:C.line}, right:{style:BorderStyle.SINGLE,size:4,color:C.line} }
    arr.push(new Table({
      alignment:AlignmentType.CENTER,
      width:{ size:80, type:WidthType.PERCENTAGE },
      rows:[ new TableRow({ children:[ new TableCell({
        margins:{ top:160, bottom:160, left:160, right:160 }, borders:FRAME, verticalAlign:VerticalAlign.CENTER,
        children:[ new Paragraph({ alignment:AlignmentType.CENTER, spacing:{ line:240, lineRule:'auto', before:0, after:0 }, children:[
          new ImageRun({ type:it.type||'png', data:dataUrlToBytes(it.dataUrl), transformation:{ width:iw, height:ih } })
        ] }) ]
      }) ] }) ]
    }))
    arr.push(p([ r('▍',{size:18,color:C.accent,bold:true}), r('图：'+title+'（系统截图 · 以原件为准）',{size:18,color:C.gray}) ],{alignment:AlignmentType.CENTER,spacing:{before:60,after:300,line:280,lineRule:'auto'}}))
  }else{
    arr.push(p(r('（未提供截图）',{size:20,color:C.gray}),{spacing:{before:60}}))
  }
  return arr
}

    if(nlArr.length){ nlArr.forEach((it,k)=>{ shotBlock('10.2 无诉讼证明'+(nlArr.length>1?('（'+(k+1)+'）'):''), it).forEach(x=>children.push(x)) }) }
  }else{ children.push(p(r('未选择。',{}))) }

  children.push(new Paragraph({ children:[new PageBreak()] }))

  /* ===== 十一、风险矩阵与评级 ===== */

  children.push(body((d.risk.overall||auto||'—')+(auto?('（风险矩阵自动评级：'+auto+'）'):'')))
  children.push(new Paragraph({ children:[new PageBreak()] }))

  /* ===== 十二、结论与建议 ===== */

  children.push(H2('12.1 主要风险点'))
  if(risks.length){

  }else{ children.push(p(r('未录入具体风险点。',{}))) }

  children.push(H2('12.3 交易建议'))
  children.push(body(d.risk.advice||'——'))
  children.push(H2('12.4 交割前置条件'))
  children.push(body(d.risk.conditions||'——'))
  children.push(H2('12.5 建议写入协议的承诺与保证'))
  children.push(body(d.risk.warranties||'——'))

  /* ===== 落款 ===== */
  children.push(p(r('',{spacing:{before:400}})))
  children.push(p([r('调查机构（盖章）：'+AGENCY_NAME,{size:26})],{alignment:AlignmentType.RIGHT,spacing:{before:1000}}))
  children.push(p([r('报告出具日期：'+dateStr,{size:26})],{alignment:AlignmentType.RIGHT,spacing:{before:160}}))

  /* 页眉页脚 */
  const header=new Header({ children:[
    new Paragraph({
      tabStops:[{ type:TabStopType.RIGHT, position:TabStopPosition.MAX }],
      spacing:{after:40}, border:{ bottom:{style:BorderStyle.SINGLE,size:6,color:C.accent} },
      children:[
        r('金米启航 ',{font:F.yahei,size:18,bold:true,color:C.primary}),

  return new Document({

}

function buildDocx(){
  const d=state

  if(state.version==='pro') return buildDocxPro()

  children.push(p(r('',{spacing:{after:60}})))

  if(risks.length){

  children.push(p([r('报告出具日期：'+dateStr,{size:26})],{alignment:AlignmentType.RIGHT,spacing:{before:160}}))

  /* 页眉页脚（科技风：左品牌右机密 · 青色分隔线） */

    new Paragraph({
      tabStops:[{ type:TabStopType.RIGHT, position:TabStopPosition.MAX }],
      spacing:{after:40}, border:{ bottom:{style:BorderStyle.SINGLE,size:6,color:C.accent} },
      children:[
        r('金米启航 ',{font:F.yahei,size:18,bold:true,color:C.primary}),
        r('| 企业尽职调查报告 · 基础版',{font:F.yahei,size:18,color:C.gray}),

        r('CONFIDENTIAL',{font:F.yahei,size:16,color:C.accent,csp:50})

  const footer=new Footer({ children:[
    new Paragraph({ alignment:AlignmentType.CENTER, spacing:{before:40}, border:{ top:{style:BorderStyle.SINGLE,size:6,color:C.accent} },
      children:[
        r('— 第 ',{size:18,color:C.gray}), new TextRun({children:[PageNumber.CURRENT],size:18,color:C.gray,font:F.song}), r(' 页 · 本报告仅供委托方内部使用 —',{size:18,color:C.gray})
      ] })
  ]})

  const doc=new Document({

      headers:{ default:header },

      children
    }]
  })
  return doc

async function generateDocx(){
  const btn=document.getElementById('btnGen')
  if(btn){ btn.disabled=true; btn.textContent='正在生成…' }
  try{
    const doc=buildDocx()
    const blob=await Packer.toBlob(doc)
    const vName=(VERSIONS.find(v=>v.id===state.version)||VERSIONS[0]).name
    const name='企业尽职调查报告（'+vName+'）_'+(state.project.company||'目标公司')+'_'+(state.project.reportDate||today())+'.docx'
    const a=document.createElement('a')
    a.href=URL.createObjectURL(blob)
    a.download=name
    document.body.appendChild(a); a.click(); a.remove()
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000)
    saveRecord()
    alert('✅ 报告已生成并开始下载。\n请用 Word / WPS 打开检查排版，可继续编辑后定稿。')
  }catch(e){
    console.error(e)
    alert('生成失败：'+e.message)
  }
  if(btn){ btn.disabled=false; btn.textContent='⬇ 生成并下载 Word 报告' }
}

/* ================= 生成记录（历史报告快照：载入数据 / 查看摘要 / 重新导出） ================= */
const REC_KEY = 'dd_records_v1'
const REC_LIMIT = 30
function fmtTime(ts){
  const d=new Date(ts), p=x=>String(x).padStart(2,"0")
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())
}
function loadRecords(){
  try{ const arr=JSON.parse(localStorage.getItem(REC_KEY)||"[]"); return Array.isArray(arr)?arr:[]; }catch(e){ return []; }
}
function findRecord(id){ return loadRecords().find(r=>r.id===id) || null; }
/* 读取一条记录的截图概况（兼容没有 shotCount 字段的旧记录） */
function recShotInfo(rec){
  if(typeof rec.stripped==='number' && typeof rec.shotCount==='number')
    return { count:rec.shotCount, stripped:!!rec.stripped }
  try{
    const s=JSON.parse(rec.snapshot||'{}')
    const items=(s.attachments&&s.attachments.items)||[]
    return { count:items.filter(x=>x&&x.dataUrl).length, stripped:items.some(x=>x&&!x.dataUrl) }
  }catch(e){ return { count:0, stripped:false } }
}
/* 写入 localStorage，配额不足返回 false（不抛异常） */
function tryWrite(key, val){
  try{ localStorage.setItem(key, val); return true }catch(e){ return false }
}
function saveRecord(){
  try{
    const v = VERSIONS.find(x=>x.id===state.version)||VERSIONS[0]
    const company = state.project.company || '未命名企业'
    const reportNo = state.project.reportNo || ''
    const mkSnap = (strip)=>{
      const s = JSON.parse(JSON.stringify(state))
      if(strip) (s.attachments.items||[]).forEach(x=>{ x.dataUrl=''; x.stripped=1 })
      return s
    }
    const mkRec = (snap, stripped)=>({
      id:'r'+Date.now(), time:Date.now(), timeStr:fmtTime(Date.now()),
      version:state.version, versionName:v.name,
      company, client:state.project.client||'', reportNo, reportDate:state.project.reportDate||'',
      /* 记录截图信息，供「载入数据」回填与列表展示 */
      shotCount:(snap.attachments&&snap.attachments.items||[]).length,
      stripped: stripped?1:0,
      snapshot: JSON.stringify(snap)
    })
    let list = loadRecords().filter(x=>!(x.version===state.version && x.company===company && x.reportNo===reportNo))
    /* 逐级降级写入：①完整截图 → ②丢掉最老记录腾空间 → ③才剥离截图内容 */
    const pack = (rec)=>[rec].concat(list)
    let rec = mkRec(mkSnap(false), false)
    let ok = tryWrite(REC_KEY, JSON.stringify(pack(rec).slice(0,REC_LIMIT)))
    for(let n=Math.min(pack(rec).length-1,8); !ok && n>=1; n--){
      ok = tryWrite(REC_KEY, JSON.stringify(pack(rec).slice(0,n)))
    }
    if(!ok){
      rec = mkRec(mkSnap(true), true)
      ok = tryWrite(REC_KEY, JSON.stringify(pack(rec).slice(0,REC_LIMIT)))
      for(let n=Math.min(pack(rec).length-1,8); !ok && n>=1; n--){
        ok = tryWrite(REC_KEY, JSON.stringify(pack(rec).slice(0,n)))
      }
    }
    if(!ok) console.warn('saveRecord: 空间不足，本次未保存生成记录')
  }catch(e){ console.warn('saveRecord 失败', e) }
}
function openRecModal(h){
  document.getElementById('recModalBody').innerHTML=h
  document.getElementById('recModal').style.display='flex'
  document.getElementById('recModalBg').style.display='block'
  document.body.style.overflow='hidden'
}
function closeRecModal(){
  document.getElementById('recModal').style.display='none'
  document.getElementById('recModalBg').style.display='none'
  document.body.style.overflow=''
}
function openRecords(){
  const list = loadRecords()
  let h = '<h3>📋 近期生成记录</h3>'
  if(!list.length){
    h += '<div class="rec-empty">暂无记录。<br>每次「生成并下载 Word 报告」成功后会自动保存一条记录：可随时<b>📂 载入数据</b>修改后重新生成，避免重复填写。</div>'
  }else{
    h += '<div class="rec-tip">共 '+list.length+' 条 · 同版本同企业同编号保留最新一条 · 最多保留 '+REC_LIMIT+' 条 · <b>载入前请先看截图标记</b></div>'
    h += list.map(rec=>{
      const vBadge = '<span class="rec-badge" style="background:#fbeccb;color:#b45309">'+esc(rec.versionName)+'</span>'
      const si = recShotInfo(rec)
      const sBadge = si.stripped
        ? '<span class="rec-badge" style="background:#fee2e2;color:#b91c1c">⚠ 无截图内容</span>'
        : (si.count ? '<span class="rec-badge" style="background:#dcfce7;color:#15803d">🖼 '+si.count+' 张</span>' : '')
      return `<div class="rec-row">
        <div style="min-width:0">
          <div class="rec-t">${esc(rec.company)}${vBadge}${sBadge}</div>
          <div class="rec-s">🕐 ${rec.timeStr} · ${rec.reportNo?('编号 '+esc(rec.reportNo)+' · '):''}${esc(rec.client||'无委托方')} · 报告日期 ${esc(rec.reportDate||'—')}</div>
        </div>
        <div class="rec-ops">
          <button class="btn" onclick="loadRecord('${rec.id}')">📂 载入数据</button>
          <button class="btn" onclick="viewRecord('${rec.id}')">📄 查看</button>
          <button class="del-btn" onclick="delRecord('${rec.id}')">删</button>
        </div>
      </div>`
    }).join('')
  }
  h += '<div style="margin-top:12px;text-align:right"><button class="btn" onclick="closeRecModal()">关闭</button></div>'
  openRecModal(h)
}
/* 记录快照里的截图被剥离时，用当前本地真实截图回填，避免载入后截图被清空
   回填规则：按环节（category）分组、按原顺序一一对应取用 */
function restoreShots(snap){
  const items = (snap && snap.attachments && snap.attachments.items) || []
  const need = items.filter(x=>x && !x.dataUrl)
  if(!need.length) return { msg:'', filled:0, lost:0 }
  const pool = {}
  ;(state.attachments.items||[]).forEach(x=>{
    if(x && x.category && x.dataUrl) (pool[x.category]=pool[x.category]||[]).push(x)
  })
  let filled=0, lost=0
  const kept=[]
  items.forEach(x=>{
    if(x.dataUrl){ kept.push(x); return }
    const arr=pool[x.category]
    if(arr && arr.length){
      const src=arr.shift()
      kept.push(Object.assign({}, src, { id:x.id, title:x.title||src.title }))
      filled++
    }else{ lost++ }   /* 本地也找不到，直接丢弃，避免空壳污染后续校验 */
  })
  snap.attachments.items = kept
  const cat = {}
  need.forEach(x=>{ cat[x.category]=1 })
  let msg='⚠ 这条记录保存时因体积超限未包含截图内容。\n\n'
    + '· 已用你当前已上传的截图回填 '+filled+' 张\n'
    + (lost ? '· 仍有 '+lost+' 张本地也没有，请在对应环节重新上传\n' : '')
    + '· 涉及环节：'+Object.keys(cat).map(c=>CAT_LABELS[c]||c).join('、')
  return { msg, filled, lost }
}
function loadRecord(id){
  const rec = findRecord(id); if(!rec) return
  const tip = rec.stripped
    ? '\n\n⚠ 该记录未保存截图内容（体积超限），载入后会尽量用你当前已上传的截图回填。'
    : ''
  if(!confirm("将载入「"+rec.timeStr+"」记录的完整数据（覆盖当前表单），确定？"+tip)) return
  try{
    const snap = JSON.parse(rec.snapshot)
    const fix = restoreShots(snap)      /* 先回填，再落到 state，避免空 dataUrl 写回 localStorage */
    state = snap
    currentStep = STEPS.length-1
    doneSteps.clear()
    STEPS.slice(0,-1).forEach((_,i)=>doneSteps.add(i))
    saveState(); renderNav(); renderStep()
    closeRecModal()
    window.scrollTo({top:0,behavior:'smooth'})
    if(fix.msg) setTimeout(()=>alert(fix.msg), 80)
  }catch(e){ alert("载入失败："+e.message) }
}
function viewRecord(id){
  const rec = findRecord(id); if(!rec) return
  let h = '<h3>📄 历史尽调报告记录</h3>'
  h += '<div style="background:#fdf4e6;border-left:4px solid #e0901a;border-radius:6px;padding:10px 13px;font-size:12.5px;margin-bottom:12px;line-height:1.8">'
  h += '<b>'+esc(rec.versionName)+'</b> · '+esc(rec.company)+' · 生成于 '+rec.timeStr+'</div>'
  h += '<div class="rec-kv"><span class="k">报告版本</span><span class="v">'+esc(rec.versionName)+'</span></div>'
  h += '<div class="rec-kv"><span class="k">目标企业</span><span class="v">'+esc(rec.company)+'</span></div>'
  h += '<div class="rec-kv"><span class="k">委托方</span><span class="v">'+esc(rec.client||'—')+'</span></div>'
  h += '<div class="rec-kv"><span class="k">报告编号</span><span class="v">'+esc(rec.reportNo||'—')+'</span></div>'
  h += '<div class="rec-kv"><span class="k">报告日期</span><span class="v">'+esc(rec.reportDate||'—')+'</span></div>'
  const si2 = recShotInfo(rec)
  h += '<div style="margin-top:10px;font-size:12.5px;color:'+(si2.stripped?'#b91c1c':'#9a8a72')+'">'
    + (si2.stripped
        ? '💡 这条记录<b>未包含截图内容</b>（保存时体积超限）。点击「载入数据」可恢复全部文字内容，截图会尽量用你当前已上传的补齐，缺口会以弹窗告知。'
        : '💡 点击「载入数据」可恢复该报告的完整填写内容（含 '+si2.count+' 张截图），到生成步骤即可重新导出 Word。')
    + '</div>'
  h += '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">'
  h += '<button class="btn" style="background:#7a3e07;color:#fff;border:none" onclick="loadRecord(\''+rec.id+'\')">📂 载入数据并重新生成</button>'
  h += '<button class="btn" onclick="openRecords()">← 返回列表</button>'
  h += '<button class="btn" onclick="closeRecModal()">关闭</button></div>'
  openRecModal(h)
}
function delRecord(id){
  if(!confirm("确定删除这条记录？")) return
  localStorage.setItem(REC_KEY, JSON.stringify(loadRecords().filter(r=>r.id!==id)))
  openRecords()
}

/* ================= 初始化 ================= */
renderNav()
renderStep()
saveState()
</script>
